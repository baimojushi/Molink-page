<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mo:link Design · 展览管理</title>
  <style>
    :root { --primary:#806A54; --accent:#7a9e7e; --bg:#f5f0eb; --card:#fff; --line:#e5ddd5; --text:#2f2925; --muted:#81766d; --danger:#b95b4b; --radius:14px; }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    .header{padding:18px 26px;background:var(--primary);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.header h1{margin:0;font-size:20px}.nav{display:flex;gap:9px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:8px 13px;border-radius:999px;font-size:13px}
    .auth{display:flex;gap:10px;align-items:center;padding:16px 24px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}.auth input{width:min(360px,100%)}
    input,select,textarea,button{font:inherit} input,select,textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);outline:none} textarea{resize:vertical}.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--primary);color:#fff;cursor:pointer}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--danger)}
    .layout{display:grid;grid-template-columns:minmax(320px,430px) minmax(0,1fr);gap:18px;padding:20px 24px 48px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 10px 28px rgba(70,50,35,.05)}.card h2{margin:0 0 16px;font-size:18px}.form{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}.status{min-height:20px;font-size:13px;color:var(--muted)}
    .list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.list{display:grid;gap:12px}.item{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fffdfb}.item-top{display:flex;justify-content:space-between;gap:14px}.item-name{font-size:17px;font-weight:650;line-height:1.45}.advisor-line{margin-top:8px;padding:8px 10px;border-radius:9px;background:rgba(111,143,116,.08);color:#607a63;font-size:12px;line-height:1.55}.badge{padding:4px 9px;border-radius:999px;font-size:11px;white-space:nowrap;background:#eee}.badge.live{background:#e7f1e8;color:#527455}.badge.draft{background:#f5ead5;color:#866a35}.badge.archived{background:#eee;color:#666}.meta{margin-top:7px;color:var(--muted);font-size:12px;line-height:1.65}.counts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.pill{font-size:12px;background:#f6f1ec;border-radius:999px;padding:5px 9px}.item-actions{display:flex;gap:8px;margin-top:13px}.item-actions button{padding:7px 11px;font-size:12px}.empty{padding:48px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
    @media(max-width:900px){.layout{grid-template-columns:1fr;padding:14px}.two{grid-template-columns:1fr}.auth{padding:14px}.header{padding:16px}}

/* 修复展览表单控件超出容器 */
*,
*::before,
*::after {
  box-sizing: border-box;
}

input,
select,
textarea,
button {
  box-sizing: border-box;
}

form,
.form-grid,
.form-row,
.form-group,
.field {
  min-width: 0;
}

input:not([type="checkbox"]):not([type="radio"]),
select,
textarea {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
}

/* 两列字段必须允许列宽收缩 */
.form-row,
.form-grid.two-columns {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}
  </style>
</head>
<body>
  <div class="header">
    <div><h1>Mo:link Design 展览管理</h1><div style="font-size:12px;opacity:.82;margin-top:5px">展览状态、展期、场馆与隔离范围</div></div>
    <div class="nav"><a href="/admin">订单管理</a><a href="/admin/artworks">作品库</a><a href="/admin/analytics">数据看板</a><a href="/admin/llm-debug">LLM 调试</a></div>
  </div>
  <div class="auth">
    <input id="admin-secret" type="password" placeholder="输入 ADMIN_SECRET">
    <button class="btn" onclick="saveSecretAndLoad()">保存口令并刷新</button>
    <span id="auth-tip" class="status">全局管理口令，展览仅用于数据范围过滤。</span>
  </div>

  <div class="layout">
    <section class="card">
      <h2 id="form-title">新建展览</h2>
      <div class="form">
        <div class="field"><label>展览名称 *</label><input id="name" placeholder="请输入展览名称"></div>
        <div class="two">
          <div class="field"><label>Slug</label><input id="slug" placeholder="留空自动生成"></div>
          <div class="field"><label>状态</label><select id="status"><option value="draft">草稿</option><option value="live">进行中</option><option value="archived">已归档</option></select></div>
        </div>
        <div class="field"><label>场馆名称</label><input id="venue_name" placeholder="如：上海外滩艺术中心 185 空间"></div>
        <div class="two">
          <div class="field"><label>收藏顾问名称（选填）</label><input id="collection_advisor_name" placeholder="请输入顾问姓名"></div>
          <div class="field"><label>收藏顾问微信号（选填）</label><input id="collection_advisor_wechat" placeholder="请输入微信号"></div>
        </div>
        <div class="two">
          <div class="field"><label>开始日期</label><input id="starts_at" type="date"></div>
          <div class="field"><label>结束日期</label><input id="ends_at" type="date"><small style="color:var(--muted)">未定档期可留空</small></div>
        </div>
        <div class="field"><label>封面图 URL</label><input id="cover_url" placeholder="https://..."></div>
        <div class="two">
          <div class="field"><label>纬度（预留）</label><input id="geo_lat" type="number" step="0.000001"></div>
          <div class="field"><label>经度（预留）</label><input id="geo_lng" type="number" step="0.000001"></div>
        </div>
        <div class="field"><label>定位半径（米，预留）</label><input id="geo_radius_m" type="number" min="1" value="400"></div>
        <div class="actions"><button class="btn" onclick="saveExhibition()">保存展览</button><button class="btn secondary" onclick="resetForm()">新建空表单</button></div>
        <div id="form-status" class="status">结束时间为空时按长期有效展示；归档由后台手动操作。</div>
      </div>
    </section>

    <section class="card">
      <div class="list-head"><h2 style="margin:0">全部展览</h2><button class="btn secondary" onclick="loadExhibitions()">刷新</button></div>
      <div id="list" class="list"><div class="empty">请输入管理口令后加载</div></div>
    </section>
  </div>

  <script src="/admin-exhibition-scope.js"></script>
  <script>
    let currentId = '';
    let exhibitionRows = [];
    const $ = id => document.getElementById(id);
    const escapeHtml = value => String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const secret = () => $('admin-secret').value.trim();

    async function api(url, options = {}) {
      const response = await fetch(url, {
        method: options.method || 'GET',
        headers: Object.assign({ 'x-admin-secret': secret() }, options.headers || {}),
        body: options.body
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `请求失败（${response.status}）`);
      return data;
    }

    function saveSecretAndLoad() {
      localStorage.setItem('adminSecret', secret());
      loadExhibitions();
      const bar = document.getElementById('molink-exhibition-scope');
      if (bar && bar.refresh) bar.refresh();
    }

    function statusLabel(status) { return ({live:'进行中',draft:'草稿',archived:'已归档'})[status] || status; }

    function renderList() {
      const list = $('list');
      if (!exhibitionRows.length) { list.innerHTML = '<div class="empty">暂无展览</div>'; return; }
      list.innerHTML = exhibitionRows.map(item => `
        <article class="item">
          <div class="item-top"><div><div class="item-name">${escapeHtml(item.name)}</div><div class="meta">${escapeHtml(item.slug || '')}</div></div><span class="badge ${escapeHtml(item.status)}">${statusLabel(item.status)}</span></div>
          <div class="meta">${escapeHtml(item.venue_name || '未填写场馆')}<br>${escapeHtml(item.starts_at || '未填写开始日期')} ${item.ends_at ? `— ${escapeHtml(item.ends_at)}` : '起（未定结束日期）'}</div>
          ${(item.collection_advisor_name || item.collection_advisor_wechat) ? `<div class="advisor-line">收藏顾问：${escapeHtml(item.collection_advisor_name || '未填写名称')}${item.collection_advisor_wechat ? ` · 微信 ${escapeHtml(item.collection_advisor_wechat)}` : ''}</div>` : ''}
          <div class="counts"><span class="pill">作品 ${Number(item.artwork_count || 0)}</span><span class="pill">订单 ${Number(item.order_count || 0)}</span><span class="pill">定位半径 ${Number(item.geo_radius_m || 400)}m</span></div>
          <div class="item-actions"><button class="btn secondary" onclick="editExhibition('${escapeHtml(item.id)}')">编辑</button><button class="btn danger" onclick="removeExhibition('${escapeHtml(item.id)}')">删除 / 归档</button></div>
        </article>
      `).join('');
    }

    async function loadExhibitions() {
      if (!secret()) return alert('请输入管理口令');
      $('list').innerHTML = '<div class="empty">正在加载...</div>';
      try {
        const data = await api('/api/admin/exhibitions');
        exhibitionRows = data.exhibitions || [];
        renderList();
        $('auth-tip').textContent = `已加载 ${exhibitionRows.length} 场展览`;
      } catch (error) {
        $('list').innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
      }
    }

    function formPayload() {
      return {
        name: $('name').value.trim(), slug: $('slug').value.trim(), status: $('status').value,
        venue_name: $('venue_name').value.trim(),
        collection_advisor_name: $('collection_advisor_name').value.trim(),
        collection_advisor_wechat: $('collection_advisor_wechat').value.trim(),
        starts_at: $('starts_at').value || null,
        ends_at: $('ends_at').value || null, cover_url: $('cover_url').value.trim(),
        geo_lat: $('geo_lat').value, geo_lng: $('geo_lng').value, geo_radius_m: $('geo_radius_m').value || 400
      };
    }

    async function saveExhibition() {
      const payload = formPayload();
      if (!payload.name) return alert('请填写展览名称');
      $('form-status').textContent = '正在保存...';
      try {
        const data = await api(currentId ? `/api/admin/exhibitions/${currentId}` : '/api/admin/exhibitions', {
          method: currentId ? 'PATCH' : 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify(payload)
        });
        $('form-status').textContent = `保存成功：${data.exhibition.name}`;
        currentId = data.exhibition.id;
        await loadExhibitions();
      } catch (error) { $('form-status').textContent = error.message; }
    }

    function editExhibition(id) {
      const item = exhibitionRows.find(row => row.id === id); if (!item) return;
      currentId = id; $('form-title').textContent = '编辑展览';
      ['name','slug','status','venue_name','collection_advisor_name','collection_advisor_wechat','starts_at','ends_at','cover_url','geo_lat','geo_lng','geo_radius_m'].forEach(key => {
        $(key).value = item[key] == null ? '' : item[key];
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function removeExhibition(id) {
      const item = exhibitionRows.find(row => row.id === id); if (!item) return;
      if (!confirm(`确认处理展览“${item.name}”？有作品或订单时会改为已归档，无关联数据时会直接删除。`)) return;
      try {
        const data = await api(`/api/admin/exhibitions/${id}`, { method:'DELETE' });
        alert(data.action === 'archived' ? '展览已有业务数据，已改为归档状态。' : '展览已删除。');
        if (currentId === id) resetForm();
        await loadExhibitions();
      } catch (error) { alert(error.message); }
    }

    function resetForm() {
      currentId = ''; $('form-title').textContent = '新建展览';
      ['name','slug','venue_name','collection_advisor_name','collection_advisor_wechat','starts_at','ends_at','cover_url','geo_lat','geo_lng'].forEach(id => $(id).value = '');
      $('status').value = 'draft'; $('geo_radius_m').value = '400';
      $('form-status').textContent = '结束时间为空时按长期有效展示；归档由后台手动操作。';
    }

    $('admin-secret').addEventListener('keydown', event => { if (event.key === 'Enter') saveSecretAndLoad(); });
    window.addEventListener('DOMContentLoaded', () => {
      $('admin-secret').value = new URLSearchParams(location.search).get('secret') || localStorage.getItem('adminSecret') || '';
      if (secret()) loadExhibitions();
    });
  </script>
</body>
</html>
