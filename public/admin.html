        const resp = await fetch(`/api/admin/approve/${orderId}`, {
          method: 'POST',
          headers: { 'x-admin-secret': 管理密钥, 'Content-Type': 'application/json' },
          body: JSON.stringify({ selected_urls: selectedUrls })
        });
        const data = await resp.json();
        if (data.success) {
          let msg = `✅ 审核通过，已交付 ${data.count} 张！\n\n交付链接: ${data.deliveryUrl}`;
          if (!data.emailSent) msg += '\n\n⚠ 邮件发送失败，请手动通知用户。';
          alert(msg);
          await 加载订单();
        } else {
          alert(data.error || '操作失败');
          if (btn) { btn.disabled = false; btn.textContent = '✓ 通过并交付选中图'; }
        }
      } catch (err) {
        alert('请求失败: ' + err.message);
        if (btn) { btn.disabled = false; btn.textContent = '✓ 通过并交付选中图'; }
      }
    }

    // ══════════════════════════════════════
    // AI 审核：重新生成
    // ══════════════════════════════════════
    async function 执行重新生成(orderId) {
      const noteEl = document.getElementById(`regen-note-${orderId}`);
      const note = noteEl ? noteEl.value.trim() : '';
      const order = 获取订单对象(orderId) || {};
      const btn = document.getElementById(`regen-btn-${orderId}`);
      if (btn) { btn.disabled = true; btn.textContent = '提交中…'; }
      try {
        const resp = await fetch(`/api/admin/regenerate/${orderId}`, {
          method: 'POST',
          headers: { 'x-admin-secret': 管理密钥, 'Content-Type': 'application/json' },
          body: JSON.stringify({ note })
        });
        const data = await resp.json();
        if (data.success) {
          alert(order.service_type === 'recommend_work'
            ? '✅ 已退回人工推荐，可直接复用上次勾选继续确认。'
            : '✅ 已重新提交生成任务，请稍后刷新查看结果。');
          await 加载订单();
        } else {
          alert(data.error || '操作失败');
          if (btn) { btn.disabled = false; btn.textContent = 重新生成按钮文案(order); }
        }
      } catch (err) {
        alert('请求失败: ' + err.message);
        if (btn) { btn.disabled = false; btn.textContent = 重新生成按钮文案(order); }
      }
    }


    function 渲染埋点详情(orderId) {
      const events = 埋点详情缓存[orderId];
      if (!events) return `<div class="events-loading">正在加载埋点数据...</div>`;
      if (events.length === 0) return `<div class="events-empty">该订单暂无埋点记录</div>`;
      return `
        <table class="events-table">
          <thead>
            <tr><th>时间</th><th>事件</th><th>页面</th><th>详情</th></tr>
          </thead>
          <tbody>
            ${events.map(event => `
              <tr>
                <td>${event.created_at || '—'}</td>
                <td>${事件类型文本(event.event_type)}</td>
                <td>${event.page_name || '—'}</td>
                <td>
                  ${event.event_type === 'page_stay' ? `<div>停留 ${格式化停留时长(event.stay_ms)}</div>` : ''}
                  ${event.image_index !== null && event.image_index !== undefined ? `<div>图片序号 ${Number(event.image_index) + 1}</div>` : ''}
                  ${event.device_uuid ? `<div style="margin-top:4px;color:var(--color-text-secondary);">设备 ${event.device_uuid}</div>` : ''}
                  ${event.image_url ? `<div style="margin-top:4px;color:var(--color-text-secondary);word-break:break-all;">图片 ${event.image_url}</div>` : ''}
                  ${event.entered_at ? `<div style="margin-top:4px;color:var(--color-text-secondary);">进入 ${event.entered_at}</div>` : ''}
                  ${event.left_at ? `<div style="margin-top:4px;color:var(--color-text-secondary);">离开 ${event.left_at}</div>` : ''}
                  ${event.payload && event.payload.source ? `<div style="margin-top:4px;color:var(--color-text-secondary);">来源 ${event.payload.source}</div>` : ''}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function 切换埋点详情(orderId) {
      if (埋点展开状态.has(orderId)) {
        埋点展开状态.delete(orderId);
        更新订单卡片(orderId);
        return;
      }

      埋点展开状态.add(orderId);
      展开状态.add(orderId);
      更新订单卡片(orderId);

      if (埋点详情缓存[orderId]) return;

      try {
        const resp = await fetch(`/api/admin/orders/${orderId}/events`, {
          headers: { 'x-admin-secret': 管理密钥 }
        });
        const data = await resp.json();
        埋点详情缓存[orderId] = data.events || [];
      } catch (err) {
        埋点详情缓存[orderId] = [];
      }
      更新订单卡片(orderId);
    }

    async function 批量下载当前筛选() {
      const orders = 获取当前筛选订单().filter(order => Array.isArray(order.delivery_images) && order.delivery_images.length > 0);
      if (orders.length === 0) return alert('当前筛选结果中没有可下载的交付图片');

      try {
        const resp = await fetch('/api/admin/orders/download-deliveries', {
          method: 'POST',
          headers: {
            'x-admin-secret': 管理密钥,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ order_ids: orders.map(order => order.id) })
        });
        if (!resp.ok) {
          const data = await resp.json();
          return alert(data.error || '批量下载失败');
        }
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `molink-deliveries-${Date.now()}.zip`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('批量下载失败: ' + err.message);
      }
    }

    // ══════════════════════════════════════
    // 删除订单
    // ══════════════════════════════════════
    async function 删除订单(orderId, serviceLabel) {
      const confirmed = confirm(`确认删除订单「${serviceLabel}」？\n\n订单及相关图片文件将被永久删除，此操作无法撤销。`);
      if (!confirmed) return;

      try {
        const resp = await fetch(`/api/admin/orders/${orderId}`, {
          method: 'DELETE',
          headers: { 'x-admin-secret': 管理密钥 }
        });
        const data = await resp.json();
        if (data.success) {
          alert('订单已删除');
          展开状态.delete(orderId);
          重交付激活.delete(orderId);
          await 加载订单();
        } else {
          alert(data.error || '删除失败');
        }
      } catch (err) { alert('删除请求失败: ' + err.message); }
    }

    // ══════════════════════════════════════
    // 初始化
    // ══════════════════════════════════════
    document.getElementById('admin-secret').addEventListener('keydown', e => {
      if (e.key === 'Enter') 加载订单();
    });

    window.addEventListener('DOMContentLoaded', () => {
      const presetSecret = 获取预填密钥();
      if (presetSecret) {
        document.getElementById('admin-secret').value = presetSecret;
        更新后台导航(presetSecret);
      } else {
        更新后台导航('');
      }
    });

    window.addEventListener('beforeunload', () => {
      清理全部订单图片资源();
    });
  </script>
</body>
</html>
