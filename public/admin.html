<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mo:link Design · 管理后台</title>
  <style>
    :root {
      --color-primary: #917355;
      --color-primary-light: #B5A091;
      --color-primary-dark: #806A54;
      --color-accent: #7a9e7e;
      --color-accent-dark: #5a7e5e;
      --color-text-primary: #2a2a2a;
      --color-text-secondary: #5a5a5a;
      --color-text-tertiary: #8a8a8a;
      --color-bg: #f5f0eb;
      --color-card: #ffffff;
      --color-border: #e5ddd5;
      --color-danger: #c45c4a;
      --color-warning-bg: #fff8f0;
      --color-warning-border: #f0d8b8;
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--color-bg);
      color: var(--color-text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ==========================================
       头部
       ========================================== */
    .header {
      background: var(--color-primary-dark);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 { font-size: 17px; font-weight: 600; }

    /* ==========================================
       验证栏
       ========================================== */
    .auth-bar {
      background: var(--color-card);
      padding: 14px 24px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .auth-bar input {
      flex: 1;
      max-width: 280px;
      padding: 9px 13px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .auth-bar input:focus { border-color: var(--color-primary); }
    .auth-bar button {
      padding: 9px 18px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }
    .auth-bar button:hover { background: var(--color-primary-dark); }

    /* ==========================================
       筛选栏
       ========================================== */
    .filter-bar {
      padding: 14px 24px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 7px 16px;
      border: 1px solid var(--color-border);
      border-radius: 20px;
      background: var(--color-card);
      font-size: 13px;
      cursor: pointer;
      color: var(--color-text-secondary);
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .filter-btn.active {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }
    .filter-btn:hover:not(.active) { border-color: var(--color-primary-light); }

    /* ==========================================
       订单容器
       ========================================== */
    .orders-container { padding: 0 24px 48px; }

    /* ==========================================
       订单卡片
       ========================================== */
    .order-card {
      background: var(--color-card);
      border-radius: var(--radius);
      margin-bottom: 14px;
      border: 1px solid var(--color-border);
      overflow: hidden;
    }
    .order-header {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      gap: 12px;
    }
    .order-header:hover { background: #fafaf8; }
    .order-info { flex: 1; min-width: 0; }
    .order-service { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .order-meta { font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .order-status {
      padding: 4px 11px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .status-pending { background: #fef3cd; color: #856404; }
    .status-delivered { background: #d4edda; color: #155724; }

    /* ==========================================
       订单详情体
       ========================================== */
    .order-body {
      padding: 0 20px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.3s ease;
    }
    .order-body.open {
      max-height: 3000px;
      padding: 20px;
      border-top: 1px solid var(--color-border);
    }

    .detail-row {
      display: flex;
      padding: 5px 0;
      font-size: 13px;
      gap: 8px;
    }
    .detail-row .label {
      width: 72px;
      color: var(--color-text-secondary);
      flex-shrink: 0;
    }

    /* 原始图片 */
    .original-images {
      display: flex;
      gap: 12px;
      margin: 14px 0;
    }
    .original-images .img-wrap { flex: 1; text-align: center; }
    .original-images img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      border: 1px solid var(--color-border);
      object-fit: cover;
    }
    .original-images .img-label {
      font-size: 12px;
      color: var(--color-text-secondary);
      margin-top: 4px;
    }

    /* ==========================================
       交付区（pending 和 redeliver 共用）
       ========================================== */
    .deliver-section { margin-top: 14px; }
    .deliver-section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-secondary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 重新交付警告提示 */
    .redeliver-warning {
      padding: 10px 14px;
      background: var(--color-warning-bg);
      border: 1px solid var(--color-warning-border);
      border-radius: var(--radius);
      font-size: 13px;
      color: #8a6020;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .drop-zone {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius);
      padding: 22px;
      text-align: center;
      color: var(--color-text-tertiary);
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 10px;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone.dragover {
      border-color: var(--color-accent);
      background: rgba(122,158,126,0.04);
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .drop-previews {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .drop-preview-item {
      position: relative;
    }
    .drop-preview-item img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      display: block;
    }
    .drop-preview-item .remove-preview {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 18px;
      height: 18px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border-radius: 50%;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
    }
    .drop-preview-item .remove-preview:hover { background: var(--color-danger); }

    .deliver-text {
      width: 100%;
      min-height: 72px;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-size: 14px;
      resize: vertical;
      outline: none;
      font-family: inherit;
      margin-bottom: 12px;
      color: var(--color-text-primary);
    }
    .deliver-text:focus { border-color: var(--color-primary); }

    .deliver-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .deliver-btn {
      padding: 10px 24px;
      background: var(--color-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
    }
    .deliver-btn:hover { background: var(--color-accent-dark); }
    .deliver-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* 重新交付按钮 */
    .redeliver-toggle-btn {
      padding: 8px 18px;
      background: transparent;
      border: 1px solid var(--color-primary-light);
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 500;
      color: var(--color-primary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .redeliver-toggle-btn:hover {
      background: rgba(145, 115, 85, 0.06);
      border-color: var(--color-primary);
    }

    /* 已交付信息栏 */
    .delivered-info {
      padding: 12px 0 4px;
      font-size: 13px;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .delivered-time { color: var(--color-accent-dark); font-weight: 500; }

    /* 已交付图片预览 */
    .delivered-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0 14px;
    }
    .delivered-images img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--color-border);
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--color-text-tertiary);
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 14px; }
    .empty-state p { font-size: 15px; }

    /* 加载状态 */
    .loading-spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: rgba(0,0,0,0.88);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
      animation: toastIn 0.3s ease;
      opacity: 1;
      transition: opacity 0.25s;
      white-space: nowrap;
    }
    .toast.fade-out { opacity: 0; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="toast-container" id="toast-container"></div>

  <div class="header">
    <h1>Mo:link Design 管理后台</h1>
  </div>

  <div class="auth-bar">
    <input type="password" id="admin-secret" placeholder="管理密钥">
    <button onclick="加载订单()">进入</button>
  </div>

  <div class="filter-bar">
    <div class="filter-btn active" data-status="" onclick="筛选订单(this, '')">全部</div>
    <div class="filter-btn" data-status="pending" onclick="筛选订单(this, 'pending')">待处理</div>
    <div class="filter-btn" data-status="delivered" onclick="筛选订单(this, 'delivered')">已交付</div>
  </div>

  <div class="orders-container" id="orders-container">
    <div class="empty-state">
      <div class="icon">○</div>
      <p>请输入管理密钥后进入</p>
    </div>
  </div>

  <script>
    let 管理密钥 = '';
    let 全部订单 = [];
    let 当前筛选 = '';

    // 每个订单的待交付文件缓存 { orderId: File[] }
    const 文件缓存 = {};
    // 已展开的订单
    const 展开状态 = new Set();
    // 重新交付面板是否激活
    const 重交付激活 = new Set();

    // ==========================================
    // Toast
    // ==========================================
    function 显示Toast(msg, icon = '✓') {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast';
      t.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
      c.appendChild(t);
      const dismiss = () => {
        if (!t.parentNode) return;
        t.classList.add('fade-out');
        setTimeout(() => t.remove(), 280);
      };
      setTimeout(dismiss, 5000);
      t.onclick = dismiss;
    }

    // ==========================================
    // 获取密钥 & 加载订单
    // ==========================================
    function 获取密钥() { return document.getElementById('admin-secret').value.trim(); }

    async function 加载订单() {
      管理密钥 = 获取密钥();
      if (!管理密钥) return;
      try {
        const resp = await fetch('/api/admin/orders', {
          headers: { 'x-admin-secret': 管理密钥 }
        });
        if (resp.status === 403) { 显示Toast('密钥错误', '✗'); return; }
        const data = await resp.json();
        全部订单 = data.orders || [];
        渲染订单列表();
      } catch (err) {
        显示Toast('加载失败: ' + err.message, '✗');
      }
    }

    // ==========================================
    // 筛选
    // ==========================================
    function 筛选订单(btn, status) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      当前筛选 = status;
      渲染订单列表();
    }

    // ==========================================
    // 渲染列表
    // ==========================================
    function 渲染订单列表() {
      const container = document.getElementById('orders-container');
      let orders = 全部订单;
      if (当前筛选) orders = orders.filter(o => o.status === 当前筛选);

      if (orders.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="icon">○</div><p>暂无订单</p></div>`;
        return;
      }
      container.innerHTML = orders.map(渲染订单卡片).join('');
    }

    function 渲染订单卡片(order) {
      const isOpen = 展开状态.has(order.id);
      const isDelivered = order.status === 'delivered';
      const isRedeliverActive = 重交付激活.has(order.id);

      // 已交付的图片列表
      const deliveredImgs = (order.delivery_images || []).map(img =>
        `<img src="/deliveries/${img}" alt="交付图片" onerror="this.style.opacity='0.3'">`
      ).join('');

      // 重新交付区域（仅已交付订单展开时显示）
      const redeliverSection = isDelivered && isRedeliverActive ? `
        <div class="deliver-section" id="redeliver-${order.id}">
          <div class="deliver-section-title">↻ 重新交付</div>
          <div class="redeliver-warning">
            重新提交将覆盖当前已交付的内容（图片和文字），交付链接保持不变。
          </div>
          ${构建交付上传区(order.id, true)}
        </div>
      ` : '';

      // 已交付状态展示
      const deliveredBlock = isDelivered ? `
        <div class="delivered-info">
          <span>已于 <span class="delivered-time">${order.delivered_at || ''}</span> 交付</span>
          <button class="redeliver-toggle-btn" onclick="切换重交付面板('${order.id}')">
            ${isRedeliverActive ? '取消重新交付' : '重新交付'}
          </button>
        </div>
        ${deliveredImgs ? `<div class="delivered-images">${deliveredImgs}</div>` : ''}
        ${redeliverSection}
      ` : '';

      // 待处理状态
      const pendingBlock = !isDelivered ? `
        <div class="deliver-section">
          <div class="deliver-section-title">交付操作</div>
          ${构建交付上传区(order.id, false)}
        </div>
      ` : '';

      return `
        <div class="order-card" id="card-${order.id}">
          <div class="order-header" onclick="展开订单('${order.id}')">
            <div class="order-info">
              <div class="order-service">${order.service_type_label || order.service_type}</div>
              <div class="order-meta">
                ${order.receive_method === 'email' ? '邮箱' : '短信'} ${order.receive_target}
                · ${order.created_at}
                ${order.extra_service ? ' · 附加服务' : ''}
              </div>
            </div>
            <span class="order-status ${isDelivered ? 'status-delivered' : 'status-pending'}">
              ${isDelivered ? '已交付' : '待处理'}
            </span>
          </div>
          <div class="order-body ${isOpen ? 'open' : ''}" id="body-${order.id}">
            <div class="detail-row"><span class="label">订单 ID</span><span style="font-size:12px;color:var(--color-text-tertiary)">${order.id}</span></div>
            <div class="detail-row"><span class="label">接收方式</span><span>${order.receive_method === 'email' ? '邮箱' : '短信'}：${order.receive_target}</span></div>
            <div class="detail-row"><span class="label">附加服务</span><span>${order.extra_service ? '是' : '否'}</span></div>

            <div class="original-images">
              ${order.artwork_image ? `<div class="img-wrap"><img src="/uploads/${order.artwork_image}" alt="作品图"><div class="img-label">作品图</div></div>` : ''}
              ${order.space_image ? `<div class="img-wrap"><img src="/uploads/${order.space_image}" alt="空间图"><div class="img-label">空间图</div></div>` : ''}
            </div>

            ${deliveredBlock}
            ${pendingBlock}
          </div>
        </div>
      `;
    }

    function 构建交付上传区(orderId, isRedeliver) {
      const submitLabel = isRedeliver ? '覆盖交付' : '交付';
      return `
        <div class="drop-zone" id="drop-${orderId}-${isRedeliver ? 'r' : 'n'}"
          ondragover="event.preventDefault(); this.classList.add('dragover')"
          ondragleave="this.classList.remove('dragover')"
          ondrop="处理拖放(event, '${orderId}', ${isRedeliver})">
          拖入或点击选择处理后的图片（可多张）
          <input type="file" multiple accept="image/*"
            onchange="处理选择文件(this, '${orderId}', ${isRedeliver})">
        </div>
        <div class="drop-previews" id="previews-${orderId}-${isRedeliver ? 'r' : 'n'}"></div>
        <textarea class="deliver-text" id="text-${orderId}-${isRedeliver ? 'r' : 'n'}"
          placeholder="回传文字（可选，渲染为图片）"></textarea>
        <div class="deliver-actions">
          <button class="deliver-btn" onclick="执行交付('${orderId}', ${isRedeliver})">${submitLabel}</button>
        </div>
      `;
    }

    // ==========================================
    // 展开 / 折叠订单
    // ==========================================
    function 展开订单(id) {
      const body = document.getElementById(`body-${id}`);
      if (!body) return;
      if (展开状态.has(id)) {
        展开状态.delete(id);
        body.classList.remove('open');
      } else {
        展开状态.add(id);
        body.classList.add('open');
      }
    }

    // ==========================================
    // 切换重新交付面板
    // ==========================================
    function 切换重交付面板(orderId) {
      if (重交付激活.has(orderId)) {
        重交付激活.delete(orderId);
        delete 文件缓存[`${orderId}_r`];
      } else {
        重交付激活.add(orderId);
      }
      渲染订单列表();
      // 重新展开
      if (展开状态.has(orderId)) {
        const body = document.getElementById(`body-${orderId}`);
        if (body) body.classList.add('open');
      }
    }

    // ==========================================
    // 文件处理
    // ==========================================
    function 缓存键(orderId, isRedeliver) {
      return isRedeliver ? `${orderId}_r` : `${orderId}_n`;
    }

    function 处理拖放(e, orderId, isRedeliver) {
      e.preventDefault();
      e.currentTarget.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      添加文件(orderId, isRedeliver, files);
    }

    function 处理选择文件(input, orderId, isRedeliver) {
      const files = Array.from(input.files);
      添加文件(orderId, isRedeliver, files);
      input.value = '';
    }

    function 添加文件(orderId, isRedeliver, files) {
      const key = 缓存键(orderId, isRedeliver);
      if (!文件缓存[key]) 文件缓存[key] = [];
      files.forEach(f => {
        文件缓存[key].push(f);
        const suffix = isRedeliver ? 'r' : 'n';
        const container = document.getElementById(`previews-${orderId}-${suffix}`);
        if (!container) return;
        const idx = 文件缓存[key].length - 1;
        const item = document.createElement('div');
        item.className = 'drop-preview-item';
        item.dataset.idx = idx;
        const img = document.createElement('img');
        img.src = URL.createObjectURL(f);
        const rm = document.createElement('div');
        rm.className = 'remove-preview';
        rm.textContent = '×';
        rm.onclick = () => 移除预览文件(orderId, isRedeliver, idx, item);
        item.appendChild(img);
        item.appendChild(rm);
        container.appendChild(item);
      });
    }

    function 移除预览文件(orderId, isRedeliver, idx, el) {
      const key = 缓存键(orderId, isRedeliver);
      if (文件缓存[key]) 文件缓存[key][idx] = null;
      el.remove();
    }

    // ==========================================
    // 执行交付 / 重新交付
    // ==========================================
    async function 执行交付(orderId, isRedeliver) {
      const key = 缓存键(orderId, isRedeliver);
      const files = (文件缓存[key] || []).filter(Boolean);
      const suffix = isRedeliver ? 'r' : 'n';
      const text = document.getElementById(`text-${orderId}-${suffix}`)?.value || '';

      if (files.length === 0 && !text.trim()) {
        显示Toast('请至少上传一张图片或输入文字', '⚠');
        return;
      }

      const btn = document.querySelector(`#${isRedeliver ? 'redeliver' : 'card'}-${orderId} .deliver-btn`);
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span class="loading-spinner"></span>${isRedeliver ? '覆盖中...' : '交付中...'}`;
      }

      const formData = new FormData();
      files.forEach(f => formData.append('images', f));
      formData.append('text', text);
      if (isRedeliver) formData.append('redeliver', '1');

      try {
        const resp = await fetch(`/api/admin/deliver/${orderId}`, {
          method: 'POST',
          headers: { 'x-admin-secret': 管理密钥 },
          body: formData
        });
        const data = await resp.json();

        if (data.success) {
          显示Toast(isRedeliver ? '已覆盖交付内容' : `交付成功，链接：${data.deliveryUrl}`, '✓');
          delete 文件缓存[key];
          重交付激活.delete(orderId);
          await 加载订单();
        } else {
          显示Toast(data.error || '交付失败', '✗');
          if (btn) { btn.disabled = false; btn.textContent = isRedeliver ? '覆盖交付' : '交付'; }
        }
      } catch (err) {
        显示Toast('请求失败：' + err.message, '✗');
        if (btn) { btn.disabled = false; btn.textContent = isRedeliver ? '覆盖交付' : '交付'; }
      }
    }

    // ==========================================
    // 初始化
    // ==========================================
    document.getElementById('admin-secret').addEventListener('keydown', e => {
      if (e.key === 'Enter') 加载订单();
    });
  </script>
</body>
</html>
