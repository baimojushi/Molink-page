<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, minimal-ui">
  <title>Mo:link Design</title>
  <style>
    /* ==========================================
       Glassmorphism + 视差滚动 + 微交互
       ========================================== */
    :root {
      /* 🎨 玻璃青色调节（0-20 推荐，数值越大青色越明显） */
      --glass-cyan-percent: 16;
      
      /* 品牌色系 - 清透轻盈 */
      --color-primary: #917355;
      --color-primary-light: #B5A091;
      --color-primary-pale: #F5F0EB;
      --color-primary-dark: #806A54;

      /* 强调色 */
      --color-accent: #7a9e7e;
      --color-accent-light: #a8c5ab;
      --color-accent-dark: #5a7e5e;

      /* 玻璃态效果 */
      --glass-bg: hsla(180, calc(var(--glass-cyan-percent) * 1%), 98%, 0.25);
      --glass-border: hsla(180, calc(var(--glass-cyan-percent) * 0.8%), 95%, 0.5);
      --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.12);
      --glass-blur: 20px;

      /* 中性色 */
      --color-text-primary: #2a2a2a;
      --color-text-secondary: #5a5a5a;
      --color-text-tertiary: #8a8a8a;
      --color-disabled-bg: rgba(240, 235, 229, 0.5);
      --color-disabled-text: #c8b8a8;

      /* 圆角 */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;

      /* 动画参数 */
      --duration-fast: 0.2s;
      --duration-normal: 0.3s;
      --duration-slow: 0.5s;
      --easing-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --easing-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --easing-enter: cubic-bezier(0, 0, 0.2, 1);

      /* 滑出动画距离 */
      --slide-distance: 40px;

      /* 面板宽度 */
      --panel-width: 480px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ==========================================
       移动端全局优化 + Chrome移动端修复
       ========================================== */
    html {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    input, textarea, [contenteditable] {
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
      font-size: max(16px, 1em);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    /* ==========================================
       视差背景层
       ========================================== */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .parallax-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      z-index: 0;
      opacity: 1;
      will-change: transform;
      background: linear-gradient(135deg, #f5efe9 0%, #e8dfd5 100%);
      background-image: url('/images/background-mobile.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: scroll;
    }

    @media (min-width: 768px) {
      .parallax-bg {
        background-image: url('/images/background.jpg');
      }
    }

    .parallax-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='3.5' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
      opacity: 0.6;
      mix-blend-mode: overlay;
    }

    /* ==========================================
       页面头部 - 玻璃态
       ========================================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .header-logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--color-primary-dark);
      transition: transform var(--duration-fast) var(--easing-bounce);
      cursor: default;
    }
    .header-logo:hover { transform: scale(1.05); }

    .header-sub {
      font-size: 12px;
      opacity: 0.7;
      margin-left: auto;
      color: var(--color-text-secondary);
    }

    /* ==========================================
       双面板外层包装器（桌面端横向布局）
       ========================================== */
    .panels-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 20px 16px 40px;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (max-width: 767px) {
      .panels-wrapper {
        flex-direction: column;
        align-items: center;
        padding: 24px 20px 60px;
      }
    }

    /* ==========================================
       表单主面板
       ========================================== */
    .form-panel {
      width: 100%;
      max-width: var(--panel-width);
      flex-shrink: 0;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (max-width: 767px) {
      .form-panel {
        max-width: 100%;
      }
    }

    /* ==========================================
       交付结果面板
       ========================================== */
    .delivery-panel {
      width: 100%;
      max-width: var(--panel-width);
      flex-shrink: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateX(60px);
      max-width: 0;
      padding: 0;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .delivery-panel.visible {
      opacity: 1;
      transform: translateX(0);
      max-width: var(--panel-width);
      pointer-events: auto;
    }

    @media (max-width: 767px) {
      .delivery-panel {
        transform: translateY(30px);
        max-width: 100%;
        max-height: 0;
      }
      .delivery-panel.visible {
        transform: translateY(0);
        max-width: 100%;
        max-height: 5000px;
      }
    }

    .delivery-card {
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      background: var(--glass-bg);
      border-radius: var(--radius-xl);
      padding: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: visible;
      background-image: linear-gradient(
        135deg,
        hsla(180, calc(var(--glass-cyan-percent) * 2), 98%, 0.4) 0%,
        hsla(180, var(--glass-cyan-percent), 95%, 0.05) 50%,
        hsla(180, calc(var(--glass-cyan-percent) / 2), 96%, 0.15) 100%
      );
    }

    /* 玻璃顶部高光 */
    .delivery-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.8) 50%, transparent 100%);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      opacity: 0.6;
    }

    /* 白色噪点纹理 */
    .delivery-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-xl);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    @media (max-width: 767px) {
      .delivery-card {
        padding: 28px 20px;
      }
    }

    /* ==========================================
       Apple 风格加载动效
       ========================================== */
    .apple-spinner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 0 20px;
    }

    .apple-spinner {
      width: 40px;
      height: 40px;
      position: relative;
    }

    .apple-spinner .petal {
      position: absolute;
      width: 3px;
      height: 10px;
      left: 50%;
      top: 50%;
      margin-left: -1.5px;
      margin-top: -20px;
      border-radius: 2px;
      background: var(--color-text-tertiary);
      transform-origin: 50% 20px;
      animation: apple-fade 1s linear infinite;
    }

    @keyframes apple-fade {
      0% { opacity: 1; }
      100% { opacity: 0.15; }
    }

    .apple-spinner-text {
      margin-top: 20px;
      font-size: 15px;
      font-weight: 500;
      color: var(--color-text-secondary);
      text-align: center;
    }

    .delivery-hint {
      margin-top: 16px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--color-text-tertiary);
      text-align: center;
      line-height: 1.6;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
    }

    @media (max-width: 767px) {
      .delivery-hint {
        font-size: 13px;
        padding: 14px 18px;
      }
    }

    /* ==========================================
       交付图片展示
       ========================================== */
    .delivery-images {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 16px;
    }

    .delivery-img-wrap {
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.3);
      transition: all var(--duration-normal) var(--easing-smooth);
    }

    .delivery-img-stage {
      position: relative;
      width: 100%;
      height: min(62vw, 420px);
      min-height: 260px;
      overflow: hidden;
      cursor: default;
      background: #ecebe7;
    }

    .delivery-img-stage.has-focus { cursor: zoom-out; }
    .delivery-img-stage.has-focus.is-full { cursor: zoom-in; }

    @media (hover: hover) {
      .delivery-img-wrap:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      }
    }

    .delivery-img-wrap img {
      position: absolute;
      display: block;
      transform-origin: 50% 50%;
      will-change: transform;
      -webkit-touch-callout: default;
      -webkit-user-select: auto;
      user-select: auto;
    }

    .delivery-img-hint {
      padding: 0;
      font-size: 11px;
      color: var(--color-text-tertiary);
      text-align: center;
      background: transparent;
    }

    .delivery-view-hint {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 2;
      padding: 6px 12px;
      border-radius: 999px;
      color: #fff;
      background: rgba(0,0,0,0.48);
      font-size: 11px;
      white-space: nowrap;
      pointer-events: none;
    }

    .delivery-img-actions {
      display: flex;
      justify-content: center;
      gap: 18px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.5);
    }

    .delivery-img-action {
      border: 0;
      padding: 5px 8px;
      color: var(--color-primary);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
    }

    @media (max-width: 767px) {
      .delivery-img-hint {
        padding: 0;
        font-size: 12px;
      }
    }

    /* 交付完成标题 */
    .delivery-done-title {
      text-align: center;
      margin-bottom: 16px;
    }

    .delivery-done-title .icon {
      font-size: 36px;
      display: inline-block;
      margin-bottom: 8px;
      animation: iconBounce 0.6s var(--easing-bounce);
    }

    .delivery-done-title h3 {
      font-size: 17px;
      color: var(--color-text-primary);
      font-weight: 600;
    }

    .delivery-done-title p {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-top: 4px;
    }

    @keyframes iconBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* 渲染的文字内容 */
    .delivery-text-content {
      margin-top: 14px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--color-text-primary);
      background: rgba(255,255,255,0.3);
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      white-space: pre-wrap;
    }

    .primary-rerender-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 0;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: rgba(122, 158, 126, 0.14);
      color: var(--color-accent-dark);
      font-size: 13px;
      line-height: 1.5;
    }

    .primary-rerender-banner.failed {
      background: rgba(145, 115, 85, 0.12);
      color: var(--color-primary-dark);
    }

    .primary-rerender-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--color-accent);
      animation: primaryRerenderPulse 1.3s ease-in-out infinite;
    }

    @keyframes primaryRerenderPulse {
      50% { opacity: 0.35; transform: scale(0.78); }
    }

    .wall-preference-panel {
      margin-top: 16px;
      padding: 16px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.28);
    }

    .wall-preference-title { font-size: 15px; font-weight: 600; color: var(--color-primary-dark); }
    .wall-preference-sub { margin-top: 5px; font-size: 12px; line-height: 1.5; color: var(--color-text-secondary); }
    .wall-preference-options { display: grid; gap: 10px; margin-top: 12px; }
    .wall-preference-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      border: 1px solid rgba(145,115,85,0.18);
      border-radius: 10px;
      background: rgba(255,255,255,0.38);
      cursor: pointer;
    }
    .wall-preference-option input { margin-top: 3px; accent-color: var(--color-accent-dark); }
    .wall-preference-option strong { display: block; font-size: 13px; }
    .wall-preference-option span { display: block; margin-top: 3px; font-size: 12px; line-height: 1.5; color: var(--color-text-secondary); }
    .wall-preference-submit {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--color-accent-dark);
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    .wall-preference-submit:disabled { opacity: 0.48; cursor: default; }
    .wall-preference-message { min-height: 18px; margin-top: 9px; font-size: 12px; color: var(--color-text-secondary); }

    .wall-preference-option.current-effect {
      background: #fff;
      border-color: rgba(122,158,126,0.48);
      box-shadow: 0 8px 24px rgba(60,60,67,0.06);
      cursor: default;
    }
    .wall-preference-option.selected { border-color: rgba(122,158,126,0.72); background: rgba(122,158,126,0.10); }
    .wall-preference-option.disabled { opacity: 0.62; cursor: default; }
    .wall-option-main { display:flex; gap:10px; align-items:flex-start; width:100%; }
    .wall-option-copy { flex:1; min-width:0; }
    .wall-option-badge {
      display:inline-flex; margin-left:7px; padding:2px 8px; border-radius:999px;
      font-size:10px; line-height:1.5; background:rgba(122,158,126,0.15); color:var(--color-accent-dark);
    }
    .wall-option-badge.current { background:#fff; border:1px solid rgba(122,158,126,0.38); }
    .wall-option-badge.pending { color:#93651c; background:rgba(214,151,57,0.15); }
    .wall-option-badge.failed { color:#b84d3c; background:rgba(196,92,74,0.12); }
    .wallpaper-opt-in { display:flex; gap:7px; align-items:center; margin-top:8px; font-size:11px; color:var(--color-text-secondary); }
    .web-advisor-copy { margin-top:14px; padding:14px; border-radius:var(--radius-md); background:rgba(255,255,255,0.26); color:var(--color-text-secondary); font-size:13px; line-height:1.75; white-space:pre-wrap; }
    .web-failure-card {
      padding:20px; border:1px solid rgba(196,92,74,0.22); border-radius:var(--radius-md);
      background:rgba(255,255,255,0.4); text-align:left;
    }
    .web-failure-card h3 { margin:0 0 10px; color:var(--color-primary-dark); font-size:19px; }
    .web-failure-card p { margin:7px 0; color:var(--color-text-secondary); font-size:13px; line-height:1.7; }
    .web-failure-followup { padding:12px; border-radius:10px; background:rgba(122,158,126,0.10); }
    .web-failure-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px; }
    .web-failure-actions button { padding:12px; border-radius:10px; border:0; cursor:pointer; font-size:13px; }
    .web-failure-primary { background:var(--color-accent-dark); color:#fff; }
    .web-failure-secondary { background:rgba(122,158,126,0.12); color:var(--color-accent-dark); }

    /* "提交新的业务"按钮 */
    .new-order-btn {
      width: 100%;
      padding: 16px;
      border: 1.5px solid rgba(159, 131, 112, 0.4);
      border-radius: var(--radius-md);
      background: transparent;
      backdrop-filter: blur(20px) saturate(150%);
      background-image: linear-gradient(
        135deg,
        rgba(155, 131, 112, 0.35) 0%,
        rgba(175, 160, 145, 0.25) 50%,
        rgba(155, 131, 112, 0.3) 100%
      );
      box-shadow:
        0 4px 16px rgba(155, 131, 112, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      color: var(--color-primary-dark);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--duration-normal) var(--easing-smooth);
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
      margin-top: 20px;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUpFade 0.5s 0.3s var(--easing-enter) forwards;
    }

    @keyframes slideUpFade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .new-order-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.5s ease;
    }

    @media (hover: hover) {
      .new-order-btn:hover::before { left: 100%; }
      .new-order-btn:hover {
        transform: translateY(-3px);
        box-shadow:
          0 8px 24px rgba(155, 131, 112, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }
    }

    .new-order-btn:active {
      transform: scale(0.98);
    }

    @media (max-width: 767px) {
      .new-order-btn {
        padding: 18px;
        font-size: 17px;
        min-height: 56px;
      }
    }

    /* ==========================================
       分区卡片 - Glassmorphism
       ========================================== */
    .section {
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      background: var(--glass-bg);
      border-radius: var(--radius-xl);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--glass-shadow);
      border: 1px solid var(--glass-border);
      position: relative;
      overflow: visible;
      background-image: linear-gradient(
        135deg,
        hsla(180, calc(var(--glass-cyan-percent) * 2), 98%, 0.4) 0%,
        hsla(180, var(--glass-cyan-percent), 95%, 0.05) 50%,
        hsla(180, calc(var(--glass-cyan-percent) / 2), 96%, 0.15) 100%
      );
      opacity: 0;
      transform: translateY(calc(-1 * var(--slide-distance)));
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-bottom: 0;
      transition: 
        opacity var(--duration-slow) var(--easing-enter),
        transform var(--duration-slow) var(--easing-enter),
        max-height var(--duration-slow) var(--easing-enter),
        padding var(--duration-slow) var(--easing-enter),
        margin var(--duration-slow) var(--easing-enter);
    }

    .section::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.8) 50%, transparent 100%);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      opacity: 0.6;
    }
    
    @media (max-width: 767px) {
      .section {
        padding: 24px;
        margin-bottom: 20px;
        border-width: 1.5px;
      }
      .section.visible {
        padding-top: 24px;
        padding-bottom: 24px;
        margin-bottom: 20px;
      }
    }
    
    .section.visible {
      opacity: 1;
      transform: translateY(0);
      max-height: 2000px;
      padding-top: 20px;
      padding-bottom: 20px;
      margin-bottom: 16px;
      overflow: visible;
    }
    
    .section:first-of-type {
      opacity: 1;
      transform: translateY(0);
      max-height: none;
      padding: 20px;
      margin-bottom: 16px;
    }

    @media (max-width: 767px) {
      .section:first-of-type {
        padding: 24px;
        margin-bottom: 20px;
      }
    }

    .section::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-xl);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    .section-title {
      font-size: 14px;
      color: var(--color-text-secondary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .section-title::before {
      content: '';
      width: 3px;
      height: 14px;
      background: var(--color-primary);
      border-radius: 2px;
    }

    /* ==========================================
       服务类型选择按钮
       ========================================== */
    .service-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (max-width: 767px) {
      .service-btns { gap: 14px; }
    }

    .service-btn {
      padding: 14px 16px;
      border: 2px solid var(--glass-border);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      font-size: 15px;
      color: var(--color-text-primary);
      cursor: pointer;
      transition: all var(--duration-normal) var(--easing-smooth);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      overflow: visible;
      min-height: 60px;
      width: 100%;
    }

    .service-btn svg {
      stroke: var(--color-text-secondary);
      opacity: 0.8;
      transition: stroke var(--duration-normal) var(--easing-smooth), opacity var(--duration-normal) var(--easing-smooth);
      flex-shrink: 0;
      margin-left: auto;
    }

    .service-btn-illustration {
      width: 200px;
      height: 60px;
    }

    .service-btn-illustration[viewBox*="240"] {
      width: 240px;
    }

    .service-btn svg rect,
    .service-btn svg line,
    .service-btn svg path,
    .service-btn svg circle,
    .service-btn svg polyline {
      stroke: inherit;
    }

    .service-btn.active svg {
      opacity: 1;
      stroke: var(--color-accent);
    }

    .service-btn.active svg rect,
    .service-btn.active svg line,
    .service-btn.active svg path,
    .service-btn.active svg circle,
    .service-btn.active svg polyline {
      stroke: var(--color-accent);
    }

    @media (max-width: 767px) {
      .service-btn {
        padding: 12px 14px;
        min-height: 50px;
        overflow: visible;
        flex-wrap: wrap;
      }

      .service-btn-illustration {
        width: 100% !important;
        height: auto !important;
        margin-top: 8px;
        opacity: 0.8 !important;
      }

      .service-btn > div:nth-child(2) {
        flex-basis: 100%;
      }

      .service-btn svg {
        margin: 8px auto 0 auto;
        display: block;
      }
    }
    
    .service-btn:active { 
      transform: scale(0.98);
      transition-duration: var(--duration-fast);
    }
    
    .service-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(122,158,126,0.15), transparent 50%);
      opacity: 0;
      transition: opacity var(--duration-normal) var(--easing-smooth);
    }
    
    @media (hover: hover) {
      .service-btn:hover::after { opacity: 1; }
    }
    
    .service-btn.active {
      border-color: var(--color-accent);
      background: rgba(122,158,126,0.2);
      color: var(--color-accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(122,158,126,0.2);
    }

    @media (max-width: 767px) {
      .service-btn.active { transform: translateY(0); }
    }
    
    .service-btn .icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      font-weight: 600;
      transition: all var(--duration-normal) var(--easing-bounce);
    }

    @media (hover: hover) {
      .service-btn:hover .icon { transform: rotate(5deg) scale(1.1); }
    }

    .service-btn.active .icon {
      background: var(--color-accent);
      color: #fff;
    }
    .service-btn:not(.active) .icon {
      background: var(--color-disabled-bg);
      color: var(--color-text-tertiary);
    }

    /* ==========================================
       图片上传区域
       ========================================== */
    .upload-row {
      display: flex;
      gap: 12px;
    }

    @media (max-width: 767px) {
      .upload-row { gap: 16px; }
    }

    .upload-box {
      flex: 1;
      aspect-ratio: 1;
      border: 2px dashed var(--glass-border);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--duration-normal) var(--easing-smooth);
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    @media (max-width: 767px) {
      .upload-box { border-width: 2.5px; }
    }
    
    @media (hover: hover) {
      .upload-box:hover:not(.disabled) {
        border-color: var(--color-accent);
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(122,158,126,0.15);
      }
    }
    
    .upload-box:active:not(.disabled) { 
      transform: translateY(-1px) scale(0.98); 
    }

    @media (max-width: 767px) {
      .upload-box:active:not(.disabled) {
        transform: scale(0.98);
        border-color: var(--color-accent);
      }
    }
    
    .upload-box.has-image {
      border-style: solid;
      border-color: var(--color-accent);
    }
    .upload-box.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .upload-box .label {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-top: 8px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 12px;
      transition: transform var(--duration-fast) var(--easing-bounce);
    }

    @media (hover: hover) {
      .upload-box:hover .label { transform: scale(1.05); }
    }
    
    .upload-box .plus {
      font-size: 32px;
      color: var(--color-text-tertiary);
      line-height: 1;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--duration-normal) var(--easing-bounce);
    }

    @media (max-width: 767px) {
      .upload-box .plus { width: 56px; height: 56px; font-size: 36px; }
    }

    @media (hover: hover) {
      .upload-box:hover .plus { 
        transform: rotate(90deg) scale(1.1);
        background: rgba(122,158,126,0.3);
        color: var(--color-accent);
      }
    }
    
    .upload-box img.preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .upload-box .remove-btn {
      position: absolute;
      top: 6px; right: 6px;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      cursor: pointer;
      transition: all var(--duration-fast) var(--easing-bounce);
      opacity: 0;
    }

    @media (max-width: 767px) {
      .upload-box .remove-btn {
        opacity: 1;
        width: 32px; height: 32px;
        font-size: 18px;
        top: 8px; right: 8px;
      }
    }

    @media (hover: hover) {
      .upload-box:hover .remove-btn { opacity: 1; }
    }

    .remove-btn:hover { 
      transform: scale(1.15) rotate(90deg);
      background: rgba(196,92,74,0.9);
    }

    @media (max-width: 767px) {
      .remove-btn:active {
        transform: scale(0.9);
        background: rgba(196,92,74,0.9);
      }
    }
    
    .upload-box input[type="file"] { display: none; }

    /* ==========================================
       接收邮箱区域（简化为纯邮箱）
       ========================================== */
    .email-input-area input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 2px solid var(--glass-border);
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--color-text-primary);
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      outline: none;
      transition: all var(--duration-normal) var(--easing-smooth);
    }

    @media (max-width: 767px) {
      .email-input-area input {
        min-height: 50px;
        font-size: 15px;
        padding: 0 16px;
      }
    }

    .email-input-area input:focus {
      border-color: var(--color-accent);
      transform: scale(1.01);
    }

    @media (max-width: 767px) {
      .email-input-area input:focus { transform: scale(1); }
    }

    .email-input-area input::placeholder {
      color: var(--color-text-tertiary);
    }

    .email-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--color-text-tertiary);
      line-height: 1.5;
    }

    @media (max-width: 767px) {
      .email-hint { font-size: 13px; }
    }

    .upload-description {
      margin-top: 16px;
      padding: 14px 18px;
      background: linear-gradient(135deg, rgba(155, 131, 112, 0.06) 0%, rgba(175, 160, 145, 0.04) 100%);
      border-left: 3px solid var(--color-primary);
      border-radius: 8px;
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.6;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .upload-description.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 767px) {
      .upload-description { 
        font-size: 14px;
        padding: 12px 16px;
      }
    }

    /* ==========================================
       附加服务开关
       ========================================== */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }

    @media (max-width: 767px) {
      .toggle-row { padding: 8px 0; }
    }

    .toggle-label {
      font-size: 14px;
      color: var(--color-text-primary);
      flex: 1;
      line-height: 1.4;
    }

    @media (max-width: 767px) {
      .toggle-label { font-size: 15px; }
    }

    .toggle-label small {
      display: block;
      color: var(--color-text-secondary);
      font-size: 12px;
      margin-top: 2px;
    }

    @media (max-width: 767px) {
      .toggle-label small { font-size: 13px; }
    }

    .toggle-switch {
      width: 48px;
      height: 28px;
      background: rgba(200,184,168,0.3);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: all var(--duration-normal) var(--easing-smooth);
      flex-shrink: 0;
      margin-left: 12px;
    }

    @media (max-width: 767px) {
      .toggle-switch {
        width: 56px; height: 32px;
        border-radius: 16px;
        margin-left: 16px;
      }
    }

    @media (hover: hover) {
      .toggle-switch:hover { transform: scale(1.05); }
    }

    @media (max-width: 767px) {
      .toggle-switch:active { transform: scale(0.95); }
    }

    .toggle-switch.active { background: var(--color-accent); }
    .toggle-switch::after {
      content: '';
      width: 22px; height: 22px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 3px; left: 3px;
      transition: left var(--duration-normal) var(--easing-bounce);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    @media (max-width: 767px) {
      .toggle-switch::after { width: 26px; height: 26px; }
    }

    .toggle-switch.active::after { left: 23px; }

    @media (max-width: 767px) {
      .toggle-switch.active::after { left: 27px; }
    }

    /* ==========================================
       提交按钮 - 褐色高硼硅玻璃质感
       ========================================== */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border: 1.5px solid rgba(159, 131, 112, 0.4);
      border-radius: var(--radius-md);
      background: transparent;
      backdrop-filter: blur(20px) saturate(150%);
      background-image: linear-gradient(
        135deg,
        rgba(155, 131, 112, 0.35) 0%,
        rgba(175, 160, 145, 0.25) 50%,
        rgba(155, 131, 112, 0.3) 100%
      );
      box-shadow: 
        0 4px 16px rgba(155, 131, 112, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      color: var(--color-primary-dark);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--duration-normal) var(--easing-smooth);
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(calc(-1 * var(--slide-distance)));
      pointer-events: none;
    }

    @media (max-width: 767px) {
      .submit-btn {
        padding: 18px;
        font-size: 17px;
        min-height: 56px;
      }
    }

    .submit-btn.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    
    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.5s ease;
    }

    @media (hover: hover) {
      .submit-btn:hover::before { left: 100%; }
      .submit-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 
          0 8px 24px rgba(155, 131, 112, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
        border-color: rgba(175, 160, 145, 0.6);
        background-image: linear-gradient(
          135deg,
          rgba(155, 131, 112, 0.4) 0%,
          rgba(175, 160, 145, 0.3) 50%,
          rgba(155, 131, 112, 0.35) 100%
        );
      }
    }
    
    .submit-btn:active:not(:disabled) {
      transform: translateY(-1px) scale(0.98);
      background-image: linear-gradient(
        135deg,
        rgba(145, 121, 102, 0.4) 0%,
        rgba(165, 150, 135, 0.3) 50%,
        rgba(145, 121, 102, 0.35) 100%
      );
    }

    @media (max-width: 767px) {
      .submit-btn:active:not(:disabled) { transform: scale(0.98); }
    }

    .submit-btn:disabled {
      background: var(--color-disabled-bg);
      background-image: none;
      color: var(--color-disabled-text);
      cursor: not-allowed;
      border-color: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    /* ==========================================
       Toast 通知（Vercel 风格）
       ========================================== */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      width: max-content;
      max-width: 90vw;
    }

    @media (max-width: 767px) {
      .toast-container {
        top: auto;
        bottom: 100px;
      }
    }

    .toast {
      background: rgba(0, 0, 0, 0.92);
      color: #fff;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      animation: toastSlideIn 0.35s var(--easing-bounce);
      opacity: 1;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(12px);
      cursor: pointer;
    }

    @media (max-width: 767px) {
      .toast {
        padding: 16px 24px;
        font-size: 15px;
        border-radius: 14px;
      }
    }

    .toast.fade-out { opacity: 0; }

    @keyframes toastSlideIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toast .icon { font-size: 16px; flex-shrink: 0; }
    .toast .close-toast { margin-left: 8px; opacity: 0.5; font-size: 16px; flex-shrink: 0; cursor: pointer; }
    .toast .close-toast:hover { opacity: 1; }

    /* ==========================================
       加载状态
       ========================================== */
    .loading-spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ==========================================
       图片放大遮罩
       ========================================== */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .lightbox-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-overlay img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      transform: scale(0.9);
      transition: transform 0.3s var(--easing-bounce);
      -webkit-touch-callout: default;
      -webkit-user-select: auto;
      user-select: auto;
    }

    .lightbox-overlay.active img {
      transform: scale(1);
    }

    .lightbox-download-btn {
      position: absolute;
      bottom: 40px;
      padding: 12px 28px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
      z-index: 10001;
    }

    .lightbox-download-btn:hover {
      background: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }

    .lightbox-download-btn:active {
      transform: translateY(0);
    }

    /* ══ illustration currentColor + sizing ══ */
    .service-btn svg.service-btn-illustration {
      color: var(--color-text-secondary);
    }
    .service-btn.active svg.service-btn-illustration {
      color: var(--color-accent);
    }
    svg.service-btn-illustration {
      height: 54px !important;
      width: auto !important;
      max-width: none !important;
      flex-shrink: 0;
      display: block;
      margin-left: auto;
    }
    @media (max-width: 767px) {
      svg.service-btn-illustration {
        width: 100% !important;
        height: auto !important;
        max-height: 76px;
        margin: 10px auto 0 !important;
        opacity: 0.9;
      }
    }
  </style>
</head>
<body>

  <!-- 视差背景层 -->
  <div class="parallax-bg"></div>

  <!-- Toast 通知容器 -->
  <div class="toast-container" id="toast-container"></div>

  <!-- 图片放大遮罩 -->
  <div class="lightbox-overlay" id="lightbox" onclick="关闭放大()">
    <img id="lightbox-img" src="" alt="放大查看">
    <button class="lightbox-download-btn" onclick="event.stopPropagation(); 下载放大图片()">⬇ 下载图片</button>
  </div>

  <div class="header">
    <div class="header-logo">Mo:link Design</div>
    <div class="header-sub">艺术空间匹配服务</div>
  </div>

  <div class="panels-wrapper" id="panels-wrapper">
    <!-- 左侧：表单面板 -->
    <div class="form-panel" id="form-panel">

      <!-- 区域1: 服务类型选择（始终可见） -->
      <div class="section" id="section-service">
        <div class="section-title">服务类型选择</div>
        <div class="service-btns">
          <div class="service-btn" data-type="hang_in_home" onclick="选择服务(this)">
            <div class="icon">A</div>

      <!-- 区域2: 图片上传 -->
      <div class="section" id="section-upload">
        <div class="section-title">图片上传</div>
        <div class="upload-row">
          <div class="upload-box disabled" id="upload-artwork" onclick="触发上传('artwork')">
            <input type="file" id="file-artwork" accept="image/*" onchange="处理上传(this, 'artwork')">
            <span class="plus">+</span>
            <span class="label">作品图片</span>
          </div>
          <div class="upload-box disabled" id="upload-space" onclick="触发上传('space')">
            <input type="file" id="file-space" accept="image/*" onchange="处理上传(this, 'space')">
            <span class="plus">+</span>
            <span class="label">空间图片</span>
          </div>
        </div>
        <div class="upload-description" id="upload-description"></div>
      </div>

      <!-- 区域3: 接收邮箱 -->
      <div class="section" id="section-receive">
        <div class="section-title">接收邮箱</div>
        <div class="email-input-area">
          <input type="email" id="receive-email" placeholder="请输入邮箱地址">
          <div class="email-hint">完成生成后我们将通过邮箱通知您</div>
        </div>
      </div>

      <!-- 区域4: 附加服务 -->
      <div class="section" id="section-extra">
        <div class="toggle-row">
          <div class="toggle-label">
            挂画后软装适配性微调
            <small>可选附加服务</small>
          </div>
          <div class="toggle-switch" id="extra-toggle" onclick="切换附加服务()"></div>
        </div>
      </div>

      <button class="submit-btn" id="submit-btn" disabled onclick="提交表单()">提交</button>

    </div>

    <!-- 右侧：交付结果面板 -->
    <div class="delivery-panel" id="delivery-panel">
      <div class="delivery-card" id="delivery-card-content">
        <!-- 动态填充 -->
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       设备 UUID 管理
       ========================================== */
    function 获取设备UUID() {
      let uuid = localStorage.getItem('molink_device_uuid');
      if (!uuid) {
        uuid = ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
          (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
        localStorage.setItem('molink_device_uuid', uuid);
      }
      return uuid;
    }

    const 设备UUID = 获取设备UUID();

    /* ==========================================
       视差滚动效果
       ========================================== */
    const parallaxBg = document.querySelector('.parallax-bg');
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    
    if (isMobile) {
      const viewportHeight = window.innerHeight;
      parallaxBg.style.height = `${viewportHeight * 2}px`;
    } else {
      function 更新背景高度() {
        const docHeight = document.documentElement.scrollHeight;
        parallaxBg.style.height = `${docHeight * 1.5}px`;
      }
      更新背景高度();
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(更新背景高度, 150);
      });
    }
    
    let ticking = false;
    let lastScrollY = 0;
    
    window.addEventListener('scroll', () => {
      lastScrollY = window.scrollY;
      if (!ticking) {
        window.requestAnimationFrame(() => {
          parallaxBg.style.transform = `translateY(${lastScrollY * 0.5}px)`;
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });

    /* ==========================================
       Toast 通知系统
       ========================================== */
    function 显示Toast(message, icon = '✓') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span class="icon">${icon}</span><span>${message}</span><span class="close-toast">✕</span>`;
      container.appendChild(toast);

      function dismiss() {
        if (toast.parentNode) {
          toast.classList.add('fade-out');
          setTimeout(() => toast.remove(), 300);
        }
      }

      toast.addEventListener('click', dismiss);
      setTimeout(dismiss, 20000);
    }

    /* ==========================================
       鼠标跟踪悬停光晕
       ========================================== */
    document.querySelectorAll('.service-btn').forEach(btn => {
      btn.addEventListener('mousemove', (e) => {
        const rect = btn.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        btn.style.setProperty('--mouse-x', `${x}%`);
        btn.style.setProperty('--mouse-y', `${y}%`);
      });
    });


    function 获取埋点会话ID() {
      const key = 'molink_analytics_session_id';
      let sessionId = localStorage.getItem(key);
      if (!sessionId) {
        sessionId = `sess_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 10)}`;
        localStorage.setItem(key, sessionId);
      }
      return sessionId;
    }

    function 记录应用埋点(eventName, payload = {}) {
      if (!eventName) return;
      fetch('/api/client/app-events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event_name: eventName,
          platform: 'web',
          session_id: 获取埋点会话ID(),
          device_uuid: 设备UUID,
          ...payload
        })
      }).catch(() => {});
    }

    function 转义HTML(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function 读取活跃订单缓存() {
      try { return JSON.parse(localStorage.getItem('molink_active_order') || '{}') || {}; }
      catch (_) { return {}; }
    }

    function 缓存活跃订单(patch) {
      localStorage.setItem('molink_active_order', JSON.stringify({ ...读取活跃订单缓存(), ...(patch || {}) }));
    }

    /* ==========================================
       状态管理
       ========================================== */
    const 状态 = {
      服务类型: null,
      接收地址: '',
      附加服务: false,
      作品图文件: null,
      空间图文件: null,
      提交中: false,
      当前步骤: 1,
      当前订单ID: null,
      轮询定时器: null,
      主墙补渲染定时器: null,
      主墙补渲染提示: '',
      网页墙纸候选: [],
      网页墙纸选择: {},
      网页墙面已加载: false,
      网页墙面等待中: false,
      当前订单失败: false,
      墙面偏好提交中: false,
      漏斗必填已完成: false,
      邮箱已埋点: false
    };

    /* ==========================================
       渐进式显示动画控制
       ========================================== */
    function 显示区域(sectionId, 回调) {
      const section = document.getElementById(sectionId);
      if (!section || section.classList.contains('visible')) {
        if (回调) 回调();
        return;
      }
      section.classList.add('visible');
      setTimeout(() => {
        const rect = section.getBoundingClientRect();
        const windowHeight = window.innerHeight;
        if (rect.bottom > windowHeight - 20) {
          section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        if (回调) setTimeout(回调, 300);
      }, 50);
    }

    /* ==========================================
       图片上传处理
       ========================================== */
    function 触发上传(type) {
      const box = document.getElementById(`upload-${type}`);
      if (box.classList.contains('disabled') || box.classList.contains('has-image')) return;
      记录应用埋点('image_choose_started', { page_name: 'index', service_type: 状态.服务类型, entry_source: 'web_home', image_key: type });
      document.getElementById(`file-${type}`).click();
    }

    function 处理上传(input, type) {
      const file = input.files[0];
      if (!file) {
        记录应用埋点('image_choose_cancel', { page_name: 'index', service_type: 状态.服务类型, entry_source: 'web_home', image_key: type });
        return;
      }

      const MAX_SIZE = 20 * 1024 * 1024; // 20MB
      if (file.size > MAX_SIZE) {
        记录应用埋点('image_choose_failed', { page_name: 'index', service_type: 状态.服务类型, entry_source: 'web_home', image_key: type, error_msg: 'file_too_large' });
        显示Toast(`图片超过 20MB 限制（当前 ${(file.size / 1024 / 1024).toFixed(1)} MB），请压缩后重新选择`, '✗');
        input.value = '';
        return;
      }

      if (type === 'artwork') 状态.作品图文件 = file;
      else 状态.空间图文件 = file;
      记录应用埋点('image_choose_success', { page_name: 'index', service_type: 状态.服务类型, entry_source: 'web_home', image_key: type, file_size: file.size || 0 });

      const box = document.getElementById(`upload-${type}`);
      box.classList.add('has-image');

      const oldPreview = box.querySelector('img.preview');
      const oldRemove = box.querySelector('.remove-btn');
      if (oldPreview) oldPreview.remove();
      if (oldRemove) oldRemove.remove();

      const img = document.createElement('img');
      img.className = 'preview';
      img.src = URL.createObjectURL(file);
      box.appendChild(img);

      const removeBtn = document.createElement('div');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '×';
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        清除上传(type);
      };
      box.appendChild(removeBtn);

      检查上传完成();
    }

    function 清除上传(type) {
      if ((type === 'artwork' && 状态.作品图文件) || (type !== 'artwork' && 状态.空间图文件)) {
        记录应用埋点('image_removed', { page_name: 'index', service_type: 状态.服务类型, entry_source: 'web_home', image_key: type });
      }
      if (type === 'artwork') 状态.作品图文件 = null;
      else 状态.空间图文件 = null;

      const box = document.getElementById(`upload-${type}`);
      box.classList.remove('has-image');
      const preview = box.querySelector('img.preview');
      const removeBtn = box.querySelector('.remove-btn');
      if (preview) preview.remove();
      if (removeBtn) removeBtn.remove();

      document.getElementById(`file-${type}`).value = '';
      检查提交条件();
    }

    /* 显示交付结果 */
    const 交付图黄金点 = [[0.382, 0.382], [0.618, 0.382], [0.382, 0.618], [0.618, 0.618]];
    let 交付图视图数据 = [];

    function 规范作品框(value) {
      const raw = Array.isArray(value) ? value : (value && typeof value === 'object' ? [value.x1, value.y1, value.x2, value.y2] : null);
      if (!raw || raw.length < 4) return null;
      const box = raw.slice(0, 4).map(Number);
      if (box.some(value => !Number.isFinite(value))) return null;
      const x1 = Math.max(0, Math.min(1, Math.min(box[0], box[2])));
      const y1 = Math.max(0, Math.min(1, Math.min(box[1], box[3])));
      const x2 = Math.max(0, Math.min(1, Math.max(box[0], box[2])));
      const y2 = Math.max(0, Math.min(1, Math.max(box[1], box[3])));
      return x2 > x1 && y2 > y1 ? [x1, y1, x2, y2] : null;
    }

    function 计算交付图聚焦(imageWidth, imageHeight, containerWidth, containerHeight, bbox) {
      if (!bbox || !imageWidth || !imageHeight || !containerWidth || !containerHeight) return null;
      const [nx1, ny1, nx2, ny2] = bbox;
      const artWidth = (nx2 - nx1) * imageWidth;
      const artHeight = (ny2 - ny1) * imageHeight;
      const centerX = (nx1 + nx2) * imageWidth / 2;
      const centerY = (ny1 + ny2) * imageHeight / 2;
      const aspect = containerWidth / containerHeight;
      let cropWidth = Math.sqrt(artWidth * artHeight * 30 * aspect);
      cropWidth = Math.max(cropWidth, artWidth * 1.15, artHeight * 1.15 * aspect);
      const cropHeight = cropWidth / aspect;
      if (cropWidth > imageWidth || cropHeight > imageHeight) return null;
      let golden = 交付图黄金点[0];
      let minDistance = Infinity;
      交付图黄金点.forEach(point => {
        const dx = centerX / imageWidth - point[0];
        const dy = centerY / imageHeight - point[1];
        const distance = dx * dx + dy * dy;
        if (distance < minDistance) { minDistance = distance; golden = point; }
      });
      const cropX = Math.max(0, Math.min(imageWidth - cropWidth, centerX - golden[0] * cropWidth));
      const cropY = Math.max(0, Math.min(imageHeight - cropHeight, centerY - golden[1] * cropHeight));
      const scale0 = Math.min(containerWidth / imageWidth, containerHeight / imageHeight);
      const zoom = Math.min(containerWidth / (cropWidth * scale0), containerHeight / (cropHeight * scale0));
      if (!Number.isFinite(zoom) || zoom <= 1.001) return null;
      const baseWidth = imageWidth * scale0;
      const baseHeight = imageHeight * scale0;
      const cropScreenX = (containerWidth - baseWidth) / 2 + (cropX + cropWidth / 2) * scale0;
      const cropScreenY = (containerHeight - baseHeight) / 2 + (cropY + cropHeight / 2) * scale0;
      return {
        baseWidth, baseHeight,
        left: (containerWidth - baseWidth) / 2,
        top: (containerHeight - baseHeight) / 2,
        transform: `translate(${-zoom * (cropScreenX - containerWidth / 2)}px, ${-zoom * (cropScreenY - containerHeight / 2)}px) scale(${zoom})`
      };
    }

    function 初始化交付图(index, img) {
      const state = 交付图视图数据[index];
      const stage = document.getElementById(`delivery-image-${index}`);
      if (!state || !stage || !img.naturalWidth || !img.naturalHeight) return;
      const focus = 计算交付图聚焦(img.naturalWidth, img.naturalHeight, stage.clientWidth, stage.clientHeight, state.bbox);
      const scale0 = Math.min(stage.clientWidth / img.naturalWidth, stage.clientHeight / img.naturalHeight);
      const layout = focus || {
        baseWidth: img.naturalWidth * scale0, baseHeight: img.naturalHeight * scale0,
        left: (stage.clientWidth - img.naturalWidth * scale0) / 2,
        top: (stage.clientHeight - img.naturalHeight * scale0) / 2
      };
      Object.assign(img.style, { width: `${layout.baseWidth}px`, height: `${layout.baseHeight}px`, left: `${layout.left}px`, top: `${layout.top}px` });
      state.hasFocus = !!focus;
      state.focusTransform = focus ? focus.transform : 'translate(0,0) scale(1)';
      state.viewState = focus ? 'focus' : 'full';
      stage.classList.toggle('has-focus', !!focus);
      stage.classList.toggle('is-full', false);
      img.style.transition = 'none';
      img.style.transform = state.focusTransform;
      const hint = stage.querySelector('.delivery-view-hint');
      if (hint) {
        hint.hidden = !focus;
        if (focus) hint.textContent = '点击查看完整空间';
      }
      requestAnimationFrame(() => requestAnimationFrame(() => { img.style.transition = 'transform 1400ms cubic-bezier(0.22, 1, 0.36, 1)'; }));
    }

    function 切换交付图视图(index) {
      const state = 交付图视图数据[index];
      if (!state || !state.hasFocus) return;
      const stage = document.getElementById(`delivery-image-${index}`);
      const img = stage && stage.querySelector('img');
      if (!img) return;
      state.viewState = state.viewState === 'focus' ? 'full' : 'focus';
      img.style.transform = state.viewState === 'focus' ? state.focusTransform : 'translate(0,0) scale(1)';
      stage.classList.toggle('is-full', state.viewState === 'full');
      const hint = stage.querySelector('.delivery-view-hint');
      if (hint) hint.textContent = state.viewState === 'focus' ? '点击查看完整空间' : '点击聚焦作品';
      记录应用埋点('result_image_view_toggle', { page_name: 'index', image_index: index, view_state: state.viewState });
    }

    function 主墙补渲染缓存键(orderId) {
      return `molink_primary_supplement:${orderId}`;
    }

    function 停止主墙补渲染轮询() {
      if (!状态.主墙补渲染定时器) return;
      clearInterval(状态.主墙补渲染定时器);
      状态.主墙补渲染定时器 = null;
    }

    function 开始主墙补渲染轮询(orderId) {
      if (!orderId || 状态.主墙补渲染定时器) return;
      状态.主墙补渲染定时器 = setInterval(async () => {
        try {
          const resp = await fetch(`/api/client/order-status/${orderId}`);
          const data = await resp.json();
          const rerenderStatus = String(data.primary_wall_rerender_status || 'idle');
          let hasPendingWall = false;
          try {
            const thinkingResp = await fetch(`/api/client/hanging-thinking/${orderId}`);
            const thinkingPayload = await thinkingResp.json();
            const thinking = thinkingPayload && (thinkingPayload.thinking || thinkingPayload);
            hasPendingWall = Boolean(thinking && thinking.has_pending_supplement);
          } catch (_) {}
          状态.网页墙面等待中 = hasPendingWall;
          if (rerenderStatus === 'pending' || hasPendingWall) {
            加载网页墙面选择(orderId, Boolean(document.querySelector('.delivery-done-title')));
            return;
          }
          显示交付结果(data);
        } catch (error) {
          console.error('追加效果轮询异常:', error);
        }
      }, 5000);
    }

    function 处理主墙补渲染状态(data) {
      const orderId = 状态.当前订单ID || data.orderId || '';
      const rerenderStatus = String(data.primary_wall_rerender_status || 'idle');
      const key = 主墙补渲染缓存键(orderId);
      const wasTracking = Boolean(orderId && localStorage.getItem(key));
      if (rerenderStatus === 'pending' || 状态.网页墙面等待中) {
        开始主墙补渲染轮询(orderId);
        return;
      }
      停止主墙补渲染轮询();
      if (orderId) localStorage.removeItem(key);
      if (wasTracking && rerenderStatus === 'succeeded') {
        状态.主墙补渲染提示 = 'succeeded';
        显示Toast('主图色彩已更新', '✓');
      } else if (wasTracking && rerenderStatus === 'failed') {
        状态.主墙补渲染提示 = 'failed';
        显示Toast('本次色彩优化未通过，已保留原图', 'i');
      }
    }

    function 主墙补渲染横幅(data) {
      const rerenderStatus = String(data.primary_wall_rerender_status || 'idle');
      if (rerenderStatus === 'pending') {
        return `<div class="primary-rerender-banner"><span class="primary-rerender-dot"></span><span>正在为主图优化色彩，稍后自动更新</span></div>`;
      }
      if (状态.主墙补渲染提示 === 'failed') {
        return `<div class="primary-rerender-banner failed"><span>本次色彩优化未通过，已保留原有交付图。</span></div>`;
      }
      return '';
    }

    function 更新网页墙面提交按钮() {
      const selectedCount = Object.values(状态.网页墙纸选择).filter(item => item && item.selected).length;
      const button = document.getElementById('web-wall-preference-submit');
      if (button) button.disabled = selectedCount === 0 || 状态.墙面偏好提交中;
    }

    function 切换网页墙面选择(input) {
      const wallId = decodeURIComponent(input.dataset.wallId || '');
      if (!wallId) return;
      const selectedCount = Object.values(状态.网页墙纸选择).filter(item => item && item.selected).length;
      if (input.checked && selectedCount >= 2) {
        input.checked = false;
        显示Toast('最多选择两面墙', 'i');
        return;
      }
      const current = 状态.网页墙纸选择[wallId] || { selected: false, wallpaper: false };
      状态.网页墙纸选择[wallId] = { ...current, selected: input.checked };
      const option = input.closest('.wall-preference-option');
      if (option) option.classList.toggle('selected', input.checked);
      更新网页墙面提交按钮();
    }

    function 切换网页墙纸建议(input) {
      const wallId = decodeURIComponent(input.dataset.wallId || '');
      if (!wallId) return;
      const current = 状态.网页墙纸选择[wallId] || { selected: false, wallpaper: false };
      状态.网页墙纸选择[wallId] = { selected: current.selected || input.checked, wallpaper: input.checked };
      const mainInput = document.querySelector(`input.web-wall-main[data-wall-id="${CSS.escape(encodeURIComponent(wallId))}"]`);
      if (mainInput && input.checked) {
        mainInput.checked = true;
        const option = mainInput.closest('.wall-preference-option');
        if (option) option.classList.add('selected');
      }
      更新网页墙面提交按钮();
    }

    function 网页墙面状态标签(item, delivered) {
      const status = String(item.supplement_status || 'idle');
      if (delivered && item.current_effect && !item.selected_by_user) return ['当前效果', 'current'];
      if (status === 'pending') return ['生成中', 'pending'];
      if (status === 'succeeded') return ['已追加', 'success'];
      if (status === 'failed') return ['未完成', 'failed'];
      if (item.selected_by_user) return ['已选择', 'success'];
      if (item.is_primary) return ['首选', ''];
      return ['', ''];
    }

    async function 加载网页墙面选择(orderId, delivered) {
      const container = document.getElementById('web-wall-preferences');
      if (!container || !orderId) return;
      try {
        const resp = await fetch(`/api/client/hanging-thinking/${orderId}`);
        const payload = await resp.json();
        const thinking = payload && (payload.thinking || payload);
        const candidates = thinking && Array.isArray(thinking.candidates) ? thinking.candidates : [];
        if (!candidates.length) {
          if (!状态.网页墙面已加载) container.innerHTML = '<div class="wall-preference-sub">顾问正在整理墙面建议，稍后会自动出现。</div>';
          return;
        }
        状态.网页墙面已加载 = true;
        状态.网页墙面等待中 = Boolean(thinking.has_pending_supplement);
        状态.网页墙纸候选 = candidates;
        const previous = 状态.网页墙纸选择 || {};
        状态.网页墙纸选择 = {};
        candidates.forEach(item => {
          const wallId = String(item.wall_id || '');
          状态.网页墙纸选择[wallId] = previous[wallId] || { selected: false, wallpaper: false };
        });
        const guide = thinking.guide_copy || '您可以选择其他墙面，我们会再完成一次挂画与渲染，并把新图追加到当前交付中。';
        container.innerHTML = `
          <div class="wall-preference-title">艺术顾问建议与墙面选择</div>
          <div class="wall-preference-sub">${转义HTML(guide)}</div>
          <div class="wall-preference-options">
            ${candidates.map(item => {
              const wallId = String(item.wall_id || '');
              const status = String(item.supplement_status || 'idle');
              const rawCurrentEffect = Boolean(item.current_effect);
              const currentEffect = Boolean(delivered && rawCurrentEffect && !thinking.has_user_selection);
              const locked = rawCurrentEffect || status === 'pending' || status === 'succeeded';
              const label = item.wall_position_zh || (item.schematic && item.schematic.wallLabel) || item.wall_zh || '候选墙面';
              const reason = item.reason || item.primary_reason || '这面墙满足当前空间的基本挂画条件。';
              const [badge, badgeClass] = 网页墙面状态标签(item, delivered);
              const checked = Boolean(状态.网页墙纸选择[wallId] && 状态.网页墙纸选择[wallId].selected);
              return `<label class="wall-preference-option ${currentEffect ? 'current-effect' : ''} ${checked ? 'selected' : ''} ${locked ? 'disabled' : ''}">
                <div class="wall-option-main">
                  ${locked ? '' : `<input class="web-wall-main" type="checkbox" data-wall-id="${encodeURIComponent(wallId)}" onchange="切换网页墙面选择(this)" ${checked ? 'checked' : ''}>`}
                  <span class="wall-option-copy">
                    <strong>${转义HTML(label)}${badge ? `<em class="wall-option-badge ${badgeClass}">${转义HTML(badge)}</em>` : ''}</strong>
                    <span>${转义HTML(reason)}</span>
                    ${item.suggest_dark_wallpaper && !currentEffect ? `<label class="wallpaper-opt-in" onclick="event.stopPropagation()"><input type="checkbox" data-wall-id="${encodeURIComponent(wallId)}" onchange="切换网页墙纸建议(this)" ${状态.网页墙纸选择[wallId].wallpaper ? 'checked' : ''} ${locked ? 'disabled' : ''}> 同时采用深色墙纸建议</label>` : ''}
                  </span>
                </div>
              </label>`;
            }).join('')}
          </div>
          <button id="web-wall-preference-submit" class="wall-preference-submit" onclick="提交网页墙面选择()" disabled>生成所选墙面的追加效果</button>
          <div id="web-wall-preference-message" class="wall-preference-message">${状态.网页墙面等待中 ? '追加效果正在生成，完成后会自动出现在交付图中。' : ''}</div>`;
        更新网页墙面提交按钮();
        if (状态.网页墙面等待中) 开始主墙补渲染轮询(orderId);
      } catch (error) {
        console.error('加载墙面建议失败:', error);
        if (!状态.网页墙面已加载) container.innerHTML = '<div class="wall-preference-sub">墙面建议暂时未载入，不影响当前订单处理。</div>';
      }
    }

    async function 提交网页墙面选择() {
      if (状态.墙面偏好提交中 || !状态.当前订单ID) return;
      const selectedWallIds = Object.keys(状态.网页墙纸选择).filter(wallId => 状态.网页墙纸选择[wallId] && 状态.网页墙纸选择[wallId].selected);
      if (!selectedWallIds.length) return;
      const wallpaperOptIn = Object.fromEntries(selectedWallIds.map(wallId => [wallId, Boolean(状态.网页墙纸选择[wallId].wallpaper)]));
      const button = document.getElementById('web-wall-preference-submit');
      const message = document.getElementById('web-wall-preference-message');
      状态.墙面偏好提交中 = true;
      if (button) { button.disabled = true; button.textContent = '正在提交…'; }
      try {
        const resp = await fetch('/api/client/wall-preferences', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            order_id: 状态.当前订单ID,
            delivery_token: 读取活跃订单缓存().deliveryToken || '',
            selected_wall_ids: selectedWallIds,
            wallpaper_opt_in: wallpaperOptIn,
            platform: 'web'
          })
        });
        const payload = await resp.json();
        if (!resp.ok) throw new Error(payload.error || '提交失败');
        状态.网页墙面等待中 = Array.isArray(payload.supplement_job_ids) && payload.supplement_job_ids.length > 0;
        if (message) message.textContent = 状态.网页墙面等待中
          ? '已开始生成所选墙面的追加效果，完成后会自动加入交付图。'
          : '已记录您的墙面选择。';
        if (payload.primary_wall_rerender_job_id) {
          localStorage.setItem(主墙补渲染缓存键(状态.当前订单ID), JSON.stringify({
            jobId: payload.primary_wall_rerender_job_id,
            wallId: payload.primary_wall_id || ''
          }));
          状态.主墙补渲染提示 = '';
        }
        状态.网页墙纸选择 = {};
        await 加载网页墙面选择(状态.当前订单ID, Boolean(document.querySelector('.delivery-done-title')));
        if (状态.网页墙面等待中) 开始主墙补渲染轮询(状态.当前订单ID);
      } catch (error) {
        if (message) message.textContent = error.message || '暂时没有提交成功，请稍后再试。';
      } finally {
        状态.墙面偏好提交中 = false;
        if (button && document.body.contains(button)) button.textContent = '生成所选墙面的追加效果';
        更新网页墙面提交按钮();
      }
    }

    function 显示交付结果(data) {
      状态.当前订单ID = data.orderId || 状态.当前订单ID;
      状态.当前订单失败 = false;
      if (data.deliveryToken) 缓存活跃订单({ orderId: 状态.当前订单ID, deliveryToken: data.deliveryToken, status: 'delivered' });
      const rerenderKey = 主墙补渲染缓存键(状态.当前订单ID || '');
      const rerenderStatus = String(data.primary_wall_rerender_status || 'idle');
      if (localStorage.getItem(rerenderKey) && ['succeeded', 'failed'].includes(rerenderStatus)) {
        状态.主墙补渲染提示 = rerenderStatus;
      }
      记录应用埋点('result_page_view', { page_name: 'index', service_type: 状态.服务类型 || data.serviceType || data.service_type || '', entry_source: 'web_home', order_id: 状态.当前订单ID || data.orderId || '' });
      let imagesHtml = '';
      const images = data.images || data.Images || [];
      const imageUrls = Array.isArray(data.imageUrls) ? data.imageUrls : (Array.isArray(data.image_urls) ? data.image_urls : images.map(img => `/deliveries/${img}`));
      const resultRecords = Array.isArray(data.resultRecords) ? data.resultRecords : (Array.isArray(data.result_records) ? data.result_records : []);
      交付图视图数据 = imageUrls.map((url, index) => ({
        url,
        bbox: 规范作品框(resultRecords[index] && ((resultRecords[index].install && resultRecords[index].install.artwork_bbox_norm) || resultRecords[index].artwork_bbox_norm)),
        hasFocus: false,
        viewState: 'full',
        focusTransform: 'translate(0,0) scale(1)'
      }));
      if (imageUrls.length > 0) {
        imagesHtml = `<div class="delivery-images">
          ${imageUrls.map((imageUrl, i) => {
            return `
            <div class="delivery-img-wrap">
              <div id="delivery-image-${i}" class="delivery-img-stage" onclick="切换交付图视图(${i})">
                <img src="${imageUrl}" alt="交付图片" onload="初始化交付图(${i}, this);${i === 0 ? '标记已查收();' : ''}" oncontextmenu="标记已下载()">
                <div class="delivery-view-hint" hidden>正在定位作品…</div>
              </div>
              <div class="delivery-img-actions">
                <button class="delivery-img-action" onclick="预览交付图(${i})">查看大图</button>
                <span class="delivery-img-hint">长按图片保存</span>
              </div>
            </div>`;
          }).join('')}
        </div>`;
      }

      const textContent = data.text || data.Text || '';
      let textHtml = '';
      if (textContent.trim()) {
        textHtml = `<div class="delivery-text-content">${textContent}</div>`;
      }

      // 获取历史记录链接
      const deliveryToken = data.deliveryToken || 读取活跃订单缓存().deliveryToken || null;

      const html = `
        <div class="delivery-done-title">
          <div class="icon">✓</div>
          <h3>已完成</h3>
          <p>${data.serviceTypeLabel || data.service_type_label || ''}</p>
        </div>
        ${imagesHtml}
        ${主墙补渲染横幅(data)}
        ${textHtml}
        <div id="web-wall-preferences" class="wall-preference-panel"><div class="wall-preference-sub">正在读取顾问建议与墙面候选…</div></div>
        <button class="new-order-btn" onclick="提交新业务()">提交新的业务</button>
        ${deliveryToken ? `<button class="new-order-btn" style="margin-top:12px; background-image:linear-gradient(135deg, rgba(122,158,126,0.35) 0%, rgba(142,178,146,0.25) 50%, rgba(122,158,126,0.3) 100%); border-color:rgba(122,158,126,0.4);" onclick="window.location.href='/d/${deliveryToken}'">查看历史记录</button>` : ''}
      `;
      显示交付面板(html);
      处理主墙补渲染状态(data);
      加载网页墙面选择(状态.当前订单ID, true);
    }

    /* ==========================================
       图片放大
       ========================================== */
    function 放大图片(src) {
      const overlay = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      overlay.classList.add('active');
    }

    function 关闭放大() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function 下载放大图片() {
      const imgSrc = document.getElementById('lightbox-img').src;
      if (!imgSrc) return;
      
      // 创建临时链接下载
      const a = document.createElement('a');
      a.href = imgSrc;
      a.download = imgSrc.split('/').pop() || 'molink-image.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      // 标记已下载
      标记已下载();
    }

    /* 标记已查收（图片加载时触发，仅调用一次） */
    let 已标记查收 = false;
    function 标记已查收() {
      if (已标记查收) return;
      if (状态.当前订单ID) {
        已标记查收 = true;
        fetch(`/api/client/mark-viewed/${状态.当前订单ID}`, { method: 'POST' }).catch(() => {});
      }
    }

    /* 标记已下载（长按保存触发，仅调用一次） */
    let 已标记下载 = false;
    function 标记已下载() {
      if (已标记下载) return;
      if (状态.当前订单ID) {
        已标记下载 = true;
        fetch(`/api/client/mark-downloaded/${状态.当前订单ID}`, { method: 'POST' }).catch(() => {});
      }
    }

    /* ==========================================
       提交表单
       ========================================== */
    async function 提交表单() {
      if (状态.提交中) return;
      记录应用埋点('submit_clicked', { page_name: 'index', service_type: 状态.服务类型, entry_source: 'web_home' });
      状态.提交中 = true;

      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<span class="loading-spinner"></span>提交中...';
      btn.disabled = true;

      const formData = new FormData();
      formData.append('service_type', 状态.服务类型);
      formData.append('receive_target', 状态.接收地址);
      formData.append('extra_service', 状态.附加服务 ? '1' : '0');
      formData.append('device_uuid', 设备UUID);
      formData.append('entry_platform', 'web');
      formData.append('entry_source', 'web_home');
      formData.append('session_id', 获取埋点会话ID());

      if (状态.作品图文件) formData.append('artwork', 状态.作品图文件);
      if (状态.空间图文件) formData.append('space', 状态.空间图文件);

      try {
        const resp = await fetch('/api/client/submit', {
          method: 'POST',
          body: formData
        });
        const data = await resp.json();

        if (data.success) {
          显示Toast('提交成功！处理完成后将通过邮箱通知您', '✓');
          状态.当前订单ID = data.orderId;
          记录应用埋点('submit_success_client', { page_name: 'index', service_type: 状态.服务类型, entry_source: 'web_home', order_id: data.orderId });
          
          // 缓存当前订单信息
          localStorage.setItem('molink_active_order', JSON.stringify({
            orderId: data.orderId,
            deliveryToken: data.deliveryToken,
            status: 'pending'
          }));

          // 显示等待面板
          显示等待状态('正在为您生成...');

          // 开始轮询
          开始轮询(data.orderId);
        } else {
          记录应用埋点('submit_failed_client', { page_name: 'index', service_type: 状态.服务类型, entry_source: 'web_home', error_msg: data.error || '提交失败' });
          显示Toast(data.error || '提交失败，请重试', '✗');
        }
      } catch (err) {
        记录应用埋点('submit_failed_client', { page_name: 'index', service_type: 状态.服务类型, entry_source: 'web_home', error_msg: err && err.message ? err.message : 'network_error' });
        显示Toast('网络异常，请检查连接后重试', '✗');
        console.error(err);
      } finally {
        状态.提交中 = false;
        btn.textContent = '提交';
        检查提交条件();
      }
    }

    /* ==========================================
       轮询订单状态
       ========================================== */
    function 开始轮询(orderId) {
      if (状态.轮询定时器) clearInterval(状态.轮询定时器);

      状态.轮询定时器 = setInterval(async () => {
        try {
          const resp = await fetch(`/api/client/order-status/${orderId}`);
          const data = await resp.json();

          if (data.deliveryToken) 缓存活跃订单({ orderId, deliveryToken: data.deliveryToken });
          if (data.status === 'delivered') {
            clearInterval(状态.轮询定时器);
            状态.轮询定时器 = null;
            缓存活跃订单({ orderId, status: 'delivered' });
            显示交付结果(data);
          } else if (data.status === 'failed') {
            缓存活跃订单({ orderId, status: 'failed' });
            显示失败状态(data);
          } else {
            更新网页等待状态(data);
          }
        } catch (e) {
          console.error('轮询异常:', e);
        }
      }, 8000); // 每8秒轮询一次
    }

    /* ==========================================
       提交新业务（重置）
       ========================================== */
    function 提交新业务() {
      // 清除缓存
      if (状态.当前订单ID) localStorage.removeItem(主墙补渲染缓存键(状态.当前订单ID));
      localStorage.removeItem('molink_active_order');
      停止主墙补渲染轮询();
      
      // 隐藏交付面板
      document.getElementById('delivery-panel').classList.remove('visible');

      // 清除轮询
      if (状态.轮询定时器) {
        clearInterval(状态.轮询定时器);
        状态.轮询定时器 = null;
      }

      // 重置表单
      重置表单();
    }

    /* ==========================================
       重置表单
       ========================================== */
    function 重置表单() {
      状态.服务类型 = null;
      状态.接收地址 = '';
      状态.附加服务 = false;
      状态.作品图文件 = null;
      状态.空间图文件 = null;
      状态.当前步骤 = 1;
      状态.当前订单ID = null;
      状态.主墙补渲染提示 = '';
      状态.网页墙纸候选 = [];
      状态.网页墙纸选择 = {};
      状态.网页墙面已加载 = false;
      状态.网页墙面等待中 = false;
      状态.当前订单失败 = false;
      状态.墙面偏好提交中 = false;
      状态.漏斗必填已完成 = false;
      状态.邮箱已埋点 = false;

      document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
      清除上传('artwork');
      清除上传('space');
      document.getElementById('upload-artwork').classList.add('disabled');
      document.getElementById('upload-space').classList.add('disabled');
      document.getElementById('receive-email').value = '';
      document.getElementById('extra-toggle').classList.remove('active');
      
      document.querySelectorAll('.section').forEach((s, i) => {
        if (i > 0) s.classList.remove('visible');
      });
      document.getElementById('submit-btn').classList.remove('visible');
      document.getElementById('submit-btn').disabled = true;
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ==========================================
       页面初始化：检查设备是否有活跃订单
       ========================================== */
    async function 初始化页面() {
      try {
        const resp = await fetch(`/api/client/device-status/${设备UUID}`);
        const data = await resp.json();

        if (data.hasActiveOrder) {
          if (data.status === 'pending' || data.status === 'processing') {
            状态.当前订单ID = data.orderId;
            显示等待状态(data.serviceTypeLabel || '正在为您生成...');
            开始轮询(data.orderId);
          } else if (data.status === 'failed') {
            状态.当前订单ID = data.orderId;
            缓存活跃订单({
              orderId: data.orderId,
              deliveryToken: data.deliveryToken,
              status: 'failed'
            });
            显示失败状态(data);
            开始轮询(data.orderId);
          } else if (data.status === 'delivered') {
            状态.当前订单ID = data.orderId;
            缓存活跃订单({
              orderId: data.orderId,
              deliveryToken: data.deliveryToken,
              status: 'delivered'
            });
            显示交付结果(data);
          }
        }
      } catch (e) {
        console.error('初始化检查设备状态失败:', e);
        // 静默失败，让用户正常使用表单
      }
    }

    // 页面加载后执行初始化
    初始化页面();
  </script>
</body>
</html>
