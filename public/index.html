<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, minimal-ui">
  <title>Mo:link Design</title>
  <style>
    /* ==========================================
       Glassmorphism + 视差滚动 + 微交互
       ========================================== */
    :root {
      /* 🎨 玻璃青色调节（0-20 推荐，数值越大青色越明显） */
      --glass-cyan-percent: 16;
      
      /* 品牌色系 - 清透轻盈 */
      --color-primary: #917355;
      --color-primary-light: #B5A091;
      --color-primary-pale: #F5F0EB;
      --color-primary-dark: #806A54;

      /* 强调色 */
      --color-accent: #7a9e7e;
      --color-accent-light: #a8c5ab;
      --color-accent-dark: #5a7e5e;

      /* 玻璃态效果 */
      --glass-bg: hsla(180, calc(var(--glass-cyan-percent) * 1%), 98%, 0.25);
      --glass-border: hsla(180, calc(var(--glass-cyan-percent) * 0.8%), 95%, 0.5);
      --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.12);
      --glass-blur: 20px;

      /* 中性色 */
      --color-text-primary: #2a2a2a;
      --color-text-secondary: #5a5a5a;
      --color-text-tertiary: #8a8a8a;
      --color-disabled-bg: rgba(240, 235, 229, 0.5);
      --color-disabled-text: #c8b8a8;

      /* 圆角 */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;

      /* 动画参数 */
      --duration-fast: 0.2s;
      --duration-normal: 0.3s;
      --duration-slow: 0.5s;
      --easing-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --easing-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --easing-enter: cubic-bezier(0, 0, 0.2, 1);

      /* 滑出动画距离 */
      --slide-distance: 40px;

      /* 面板宽度 */
      --panel-width: 480px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ==========================================
       移动端全局优化 + Chrome移动端修复
       ========================================== */
    html {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    input, textarea, [contenteditable] {
      -webkit-user-select: text;
      user-select: text;
      touch-action: auto;
      font-size: max(16px, 1em);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    /* ==========================================
       视差背景层
       ========================================== */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .parallax-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      z-index: 0;
      opacity: 1;
      will-change: transform;
      background: linear-gradient(135deg, #f5efe9 0%, #e8dfd5 100%);
      background-image: url('/images/background-mobile.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: scroll;
    }

    @media (min-width: 768px) {
      .parallax-bg {
        background-image: url('/images/background.jpg');
      }
    }

    .parallax-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='3.5' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
      opacity: 0.6;
      mix-blend-mode: overlay;
    }

    /* ==========================================
       页面头部 - 玻璃态
       ========================================== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      background: var(--glass-bg);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .header-logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--color-primary-dark);
      transition: transform var(--duration-fast) var(--easing-bounce);
      cursor: default;
    }
    .header-logo:hover { transform: scale(1.05); }

    .header-sub {
      font-size: 12px;
      opacity: 0.7;
      margin-left: auto;
      color: var(--color-text-secondary);
    }

    /* ==========================================
       双面板外层包装器（桌面端横向布局）
       ========================================== */
    .panels-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
      padding: 20px 16px 40px;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (max-width: 767px) {
      .panels-wrapper {
        flex-direction: column;
        align-items: center;
        padding: 24px 20px 60px;
      }
    }

    /* ==========================================
       表单主面板
       ========================================== */
    .form-panel {
      width: 100%;
      max-width: var(--panel-width);
      flex-shrink: 0;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (max-width: 767px) {
      .form-panel {
        max-width: 100%;
      }
    }

    /* ==========================================
       交付结果面板
       ========================================== */
    .delivery-panel {
      width: 100%;
      max-width: var(--panel-width);
      flex-shrink: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateX(60px);
      max-width: 0;
      padding: 0;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }

    .delivery-panel.visible {
      opacity: 1;
      transform: translateX(0);
      max-width: var(--panel-width);
      pointer-events: auto;
    }

    @media (max-width: 767px) {
      .delivery-panel {
        transform: translateY(30px);
        max-width: 100%;
        max-height: 0;
      }
      .delivery-panel.visible {
        transform: translateY(0);
        max-width: 100%;
        max-height: 5000px;
      }
    }

    .delivery-card {
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      background: var(--glass-bg);
      border-radius: var(--radius-xl);
      padding: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: visible;
      background-image: linear-gradient(
        135deg,
        hsla(180, calc(var(--glass-cyan-percent) * 2), 98%, 0.4) 0%,
        hsla(180, var(--glass-cyan-percent), 95%, 0.05) 50%,
        hsla(180, calc(var(--glass-cyan-percent) / 2), 96%, 0.15) 100%
      );
    }

    /* 玻璃顶部高光 */
    .delivery-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.8) 50%, transparent 100%);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      opacity: 0.6;
    }

    /* 白色噪点纹理 */
    .delivery-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-xl);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    @media (max-width: 767px) {
      .delivery-card {
        padding: 28px 20px;
      }
    }

    /* ==========================================
       Apple 风格加载动效
       ========================================== */
    .apple-spinner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 0 20px;
    }

    .apple-spinner {
      width: 40px;
      height: 40px;
      position: relative;
    }

    .apple-spinner .petal {
      position: absolute;
      width: 3px;
      height: 10px;
      left: 50%;
      top: 50%;
      margin-left: -1.5px;
      margin-top: -20px;
      border-radius: 2px;
      background: var(--color-text-tertiary);
      transform-origin: 50% 20px;
      animation: apple-fade 1s linear infinite;
    }

    @keyframes apple-fade {
      0% { opacity: 1; }
      100% { opacity: 0.15; }
    }

    .apple-spinner-text {
      margin-top: 20px;
      font-size: 15px;
      font-weight: 500;
      color: var(--color-text-secondary);
      text-align: center;
    }

    .delivery-hint {
      margin-top: 16px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--color-text-tertiary);
      text-align: center;
      line-height: 1.6;
      background: rgba(255,255,255,0.2);
      border-radius: var(--radius-md);
    }

    @media (max-width: 767px) {
      .delivery-hint {
        font-size: 13px;
        padding: 14px 18px;
      }
    }

    /* ==========================================
       交付图片展示
       ========================================== */
    .delivery-images {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 16px;
    }

    .delivery-img-wrap {
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      background: rgba(255,255,255,0.3);
      transition: all var(--duration-normal) var(--easing-smooth);
    }

    @media (hover: hover) {
      .delivery-img-wrap:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      }
    }

    .delivery-img-wrap img {
      width: 100%;
      display: block;
      -webkit-touch-callout: default;
      -webkit-user-select: auto;
      user-select: auto;
    }

    .delivery-img-hint {
      padding: 6px 10px;
      font-size: 11px;
      color: var(--color-text-tertiary);
      text-align: center;
      background: rgba(255,255,255,0.5);
    }

    @media (max-width: 767px) {
      .delivery-img-hint {
        padding: 8px 12px;
        font-size: 12px;
      }
    }

    /* 交付完成标题 */
    .delivery-done-title {
      text-align: center;
      margin-bottom: 16px;
    }

    .delivery-done-title .icon {
      font-size: 36px;
      display: inline-block;
      margin-bottom: 8px;
      animation: iconBounce 0.6s var(--easing-bounce);
    }

    .delivery-done-title h3 {
      font-size: 17px;
      color: var(--color-text-primary);
      font-weight: 600;
    }

    .delivery-done-title p {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-top: 4px;
    }

    @keyframes iconBounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* 渲染的文字内容 */
    .delivery-text-content {
      margin-top: 14px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--color-text-primary);
      background: rgba(255,255,255,0.3);
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      white-space: pre-wrap;
    }

    /* "提交新的业务"按钮 */
    .new-order-btn {
      width: 100%;
      padding: 16px;
      border: 1.5px solid rgba(159, 131, 112, 0.4);
      border-radius: var(--radius-md);
      background: transparent;
      backdrop-filter: blur(20px) saturate(150%);
      background-image: linear-gradient(
        135deg,
        rgba(155, 131, 112, 0.35) 0%,
        rgba(175, 160, 145, 0.25) 50%,
        rgba(155, 131, 112, 0.3) 100%
      );
      box-shadow:
        0 4px 16px rgba(155, 131, 112, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      color: var(--color-primary-dark);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--duration-normal) var(--easing-smooth);
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
      margin-top: 20px;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUpFade 0.5s 0.3s var(--easing-enter) forwards;
    }

    @keyframes slideUpFade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .new-order-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.5s ease;
    }

    @media (hover: hover) {
      .new-order-btn:hover::before { left: 100%; }
      .new-order-btn:hover {
        transform: translateY(-3px);
        box-shadow:
          0 8px 24px rgba(155, 131, 112, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
      }
    }

    .new-order-btn:active {
      transform: scale(0.98);
    }

    @media (max-width: 767px) {
      .new-order-btn {
        padding: 18px;
        font-size: 17px;
        min-height: 56px;
      }
    }

    /* ==========================================
       分区卡片 - Glassmorphism
       ========================================== */
    .section {
      backdrop-filter: blur(var(--glass-blur)) saturate(180%);
      background: var(--glass-bg);
      border-radius: var(--radius-xl);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--glass-shadow);
      border: 1px solid var(--glass-border);
      position: relative;
      overflow: visible;
      background-image: linear-gradient(
        135deg,
        hsla(180, calc(var(--glass-cyan-percent) * 2), 98%, 0.4) 0%,
        hsla(180, var(--glass-cyan-percent), 95%, 0.05) 50%,
        hsla(180, calc(var(--glass-cyan-percent) / 2), 96%, 0.15) 100%
      );
      opacity: 0;
      transform: translateY(calc(-1 * var(--slide-distance)));
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-bottom: 0;
      transition: 
        opacity var(--duration-slow) var(--easing-enter),
        transform var(--duration-slow) var(--easing-enter),
        max-height var(--duration-slow) var(--easing-enter),
        padding var(--duration-slow) var(--easing-enter),
        margin var(--duration-slow) var(--easing-enter);
    }

    .section::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.8) 50%, transparent 100%);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      opacity: 0.6;
    }
    
    @media (max-width: 767px) {
      .section {
        padding: 24px;
        margin-bottom: 20px;
        border-width: 1.5px;
      }
      .section.visible {
        padding-top: 24px;
        padding-bottom: 24px;
        margin-bottom: 20px;
      }
    }
    
    .section.visible {
      opacity: 1;
      transform: translateY(0);
      max-height: 2000px;
      padding-top: 20px;
      padding-bottom: 20px;
      margin-bottom: 16px;
      overflow: visible;
    }
    
    .section:first-of-type {
      opacity: 1;
      transform: translateY(0);
      max-height: none;
      padding: 20px;
      margin-bottom: 16px;
    }

    @media (max-width: 767px) {
      .section:first-of-type {
        padding: 24px;
        margin-bottom: 20px;
      }
    }

    .section::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-xl);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2.5' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    .section-title {
      font-size: 14px;
      color: var(--color-text-secondary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .section-title::before {
      content: '';
      width: 3px;
      height: 14px;
      background: var(--color-primary);
      border-radius: 2px;
    }

    /* ==========================================
       服务类型选择按钮
       ========================================== */
    .service-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (max-width: 767px) {
      .service-btns { gap: 14px; }
    }

    .service-btn {
      padding: 14px 16px;
      border: 2px solid var(--glass-border);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      font-size: 15px;
      color: var(--color-text-primary);
      cursor: pointer;
      transition: all var(--duration-normal) var(--easing-smooth);
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }

    @media (max-width: 767px) {
      .service-btn {
        padding: 16px 18px;
        min-height: 56px;
      }
    }
    
    .service-btn:active { 
      transform: scale(0.98);
      transition-duration: var(--duration-fast);
    }
    
    .service-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(122,158,126,0.15), transparent 50%);
      opacity: 0;
      transition: opacity var(--duration-normal) var(--easing-smooth);
    }
    
    @media (hover: hover) {
      .service-btn:hover::after { opacity: 1; }
    }
    
    .service-btn.active {
      border-color: var(--color-accent);
      background: rgba(122,158,126,0.2);
      color: var(--color-accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(122,158,126,0.2);
    }

    @media (max-width: 767px) {
      .service-btn.active { transform: translateY(0); }
    }
    
    .service-btn .icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      font-weight: 600;
      transition: all var(--duration-normal) var(--easing-bounce);
    }

    @media (hover: hover) {
      .service-btn:hover .icon { transform: rotate(5deg) scale(1.1); }
    }

    .service-btn.active .icon {
      background: var(--color-accent);
      color: #fff;
    }
    .service-btn:not(.active) .icon {
      background: var(--color-disabled-bg);
      color: var(--color-text-tertiary);
    }

    /* ==========================================
       图片上传区域
       ========================================== */
    .upload-row {
      display: flex;
      gap: 12px;
    }

    @media (max-width: 767px) {
      .upload-row { gap: 16px; }
    }

    .upload-box {
      flex: 1;
      aspect-ratio: 1;
      border: 2px dashed var(--glass-border);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--duration-normal) var(--easing-smooth);
      position: relative;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    @media (max-width: 767px) {
      .upload-box { border-width: 2.5px; }
    }
    
    @media (hover: hover) {
      .upload-box:hover:not(.disabled) {
        border-color: var(--color-accent);
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(122,158,126,0.15);
      }
    }
    
    .upload-box:active:not(.disabled) { 
      transform: translateY(-1px) scale(0.98); 
    }

    @media (max-width: 767px) {
      .upload-box:active:not(.disabled) {
        transform: scale(0.98);
        border-color: var(--color-accent);
      }
    }
    
    .upload-box.has-image {
      border-style: solid;
      border-color: var(--color-accent);
    }
    .upload-box.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .upload-box .label {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-top: 8px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 12px;
      transition: transform var(--duration-fast) var(--easing-bounce);
    }

    @media (hover: hover) {
      .upload-box:hover .label { transform: scale(1.05); }
    }
    
    .upload-box .plus {
      font-size: 32px;
      color: var(--color-text-tertiary);
      line-height: 1;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--duration-normal) var(--easing-bounce);
    }

    @media (max-width: 767px) {
      .upload-box .plus { width: 56px; height: 56px; font-size: 36px; }
    }

    @media (hover: hover) {
      .upload-box:hover .plus { 
        transform: rotate(90deg) scale(1.1);
        background: rgba(122,158,126,0.3);
        color: var(--color-accent);
      }
    }
    
    .upload-box img.preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .upload-box .remove-btn {
      position: absolute;
      top: 6px; right: 6px;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      cursor: pointer;
      transition: all var(--duration-fast) var(--easing-bounce);
      opacity: 0;
    }

    @media (max-width: 767px) {
      .upload-box .remove-btn {
        opacity: 1;
        width: 32px; height: 32px;
        font-size: 18px;
        top: 8px; right: 8px;
      }
    }

    @media (hover: hover) {
      .upload-box:hover .remove-btn { opacity: 1; }
    }

    .remove-btn:hover { 
      transform: scale(1.15) rotate(90deg);
      background: rgba(196,92,74,0.9);
    }

    @media (max-width: 767px) {
      .remove-btn:active {
        transform: scale(0.9);
        background: rgba(196,92,74,0.9);
      }
    }
    
    .upload-box input[type="file"] { display: none; }

    /* ==========================================
       接收邮箱区域（简化为纯邮箱）
       ========================================== */
    .email-input-area input {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border: 2px solid var(--glass-border);
      border-radius: var(--radius-md);
      font-size: 14px;
      color: var(--color-text-primary);
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(8px);
      outline: none;
      transition: all var(--duration-normal) var(--easing-smooth);
    }

    @media (max-width: 767px) {
      .email-input-area input {
        min-height: 50px;
        font-size: 15px;
        padding: 0 16px;
      }
    }

    .email-input-area input:focus {
      border-color: var(--color-accent);
      transform: scale(1.01);
    }

    @media (max-width: 767px) {
      .email-input-area input:focus { transform: scale(1); }
    }

    .email-input-area input::placeholder {
      color: var(--color-text-tertiary);
    }

    .email-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--color-text-tertiary);
      line-height: 1.5;
    }

    @media (max-width: 767px) {
      .email-hint { font-size: 13px; }
    }

    .upload-description {
      margin-top: 16px;
      padding: 14px 18px;
      background: linear-gradient(135deg, rgba(155, 131, 112, 0.06) 0%, rgba(175, 160, 145, 0.04) 100%);
      border-left: 3px solid var(--color-primary);
      border-radius: 8px;
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.6;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .upload-description.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 767px) {
      .upload-description { 
        font-size: 14px;
        padding: 12px 16px;
      }
    }

    /* ==========================================
       附加服务开关
       ========================================== */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }

    @media (max-width: 767px) {
      .toggle-row { padding: 8px 0; }
    }

    .toggle-label {
      font-size: 14px;
      color: var(--color-text-primary);
      flex: 1;
      line-height: 1.4;
    }

    @media (max-width: 767px) {
      .toggle-label { font-size: 15px; }
    }

    .toggle-label small {
      display: block;
      color: var(--color-text-secondary);
      font-size: 12px;
      margin-top: 2px;
    }

    @media (max-width: 767px) {
      .toggle-label small { font-size: 13px; }
    }

    .toggle-switch {
      width: 48px;
      height: 28px;
      background: rgba(200,184,168,0.3);
      backdrop-filter: blur(4px);
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      transition: all var(--duration-normal) var(--easing-smooth);
      flex-shrink: 0;
      margin-left: 12px;
    }

    @media (max-width: 767px) {
      .toggle-switch {
        width: 56px; height: 32px;
        border-radius: 16px;
        margin-left: 16px;
      }
    }

    @media (hover: hover) {
      .toggle-switch:hover { transform: scale(1.05); }
    }

    @media (max-width: 767px) {
      .toggle-switch:active { transform: scale(0.95); }
    }

    .toggle-switch.active { background: var(--color-accent); }
    .toggle-switch::after {
      content: '';
      width: 22px; height: 22px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 3px; left: 3px;
      transition: left var(--duration-normal) var(--easing-bounce);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    @media (max-width: 767px) {
      .toggle-switch::after { width: 26px; height: 26px; }
    }

    .toggle-switch.active::after { left: 23px; }

    @media (max-width: 767px) {
      .toggle-switch.active::after { left: 27px; }
    }

    /* ==========================================
       提交按钮 - 褐色高硼硅玻璃质感
       ========================================== */
    .submit-btn {
      width: 100%;
      padding: 16px;
      border: 1.5px solid rgba(159, 131, 112, 0.4);
      border-radius: var(--radius-md);
      background: transparent;
      backdrop-filter: blur(20px) saturate(150%);
      background-image: linear-gradient(
        135deg,
        rgba(155, 131, 112, 0.35) 0%,
        rgba(175, 160, 145, 0.25) 50%,
        rgba(155, 131, 112, 0.3) 100%
      );
      box-shadow: 
        0 4px 16px rgba(155, 131, 112, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      color: var(--color-primary-dark);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--duration-normal) var(--easing-smooth);
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(calc(-1 * var(--slide-distance)));
      pointer-events: none;
    }

    @media (max-width: 767px) {
      .submit-btn {
        padding: 18px;
        font-size: 17px;
        min-height: 56px;
      }
    }

    .submit-btn.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    
    .submit-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.5s ease;
    }

    @media (hover: hover) {
      .submit-btn:hover::before { left: 100%; }
      .submit-btn:hover:not(:disabled) {
        transform: translateY(-3px);
        box-shadow: 
          0 8px 24px rgba(155, 131, 112, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.6);
        border-color: rgba(175, 160, 145, 0.6);
        background-image: linear-gradient(
          135deg,
          rgba(155, 131, 112, 0.4) 0%,
          rgba(175, 160, 145, 0.3) 50%,
          rgba(155, 131, 112, 0.35) 100%
        );
      }
    }
    
    .submit-btn:active:not(:disabled) {
      transform: translateY(-1px) scale(0.98);
      background-image: linear-gradient(
        135deg,
        rgba(145, 121, 102, 0.4) 0%,
        rgba(165, 150, 135, 0.3) 50%,
        rgba(145, 121, 102, 0.35) 100%
      );
    }

    @media (max-width: 767px) {
      .submit-btn:active:not(:disabled) { transform: scale(0.98); }
    }

    .submit-btn:disabled {
      background: var(--color-disabled-bg);
      background-image: none;
      color: var(--color-disabled-text);
      cursor: not-allowed;
      border-color: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    /* ==========================================
       Toast 通知（Vercel 风格）
       ========================================== */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      width: max-content;
      max-width: 90vw;
    }

    @media (max-width: 767px) {
      .toast-container {
        top: auto;
        bottom: 100px;
      }
    }

    .toast {
      background: rgba(0, 0, 0, 0.92);
      color: #fff;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      animation: toastSlideIn 0.35s var(--easing-bounce);
      opacity: 1;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(12px);
      cursor: pointer;
    }

    @media (max-width: 767px) {
      .toast {
        padding: 16px 24px;
        font-size: 15px;
        border-radius: 14px;
      }
    }

    .toast.fade-out { opacity: 0; }

    @keyframes toastSlideIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .toast .icon { font-size: 16px; flex-shrink: 0; }
    .toast .close-toast { margin-left: 8px; opacity: 0.5; font-size: 16px; flex-shrink: 0; cursor: pointer; }
    .toast .close-toast:hover { opacity: 1; }

    /* ==========================================
       加载状态
       ========================================== */
    .loading-spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ==========================================
       图片放大遮罩
       ========================================== */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      cursor: pointer;
    }

    .lightbox-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-overlay img {
      max-width: 92vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      transform: scale(0.9);
      transition: transform 0.3s var(--easing-bounce);
      -webkit-touch-callout: default;
      -webkit-user-select: auto;
      user-select: auto;
    }

    .lightbox-overlay.active img {
      transform: scale(1);
    }

    .lightbox-download-btn {
      position: absolute;
      bottom: 40px;
      padding: 12px 28px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
      z-index: 10001;
    }

    .lightbox-download-btn:hover {
      background: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.4);
    }

    .lightbox-download-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- 视差背景层 -->
  <div class="parallax-bg"></div>

  <!-- Toast 通知容器 -->
  <div class="toast-container" id="toast-container"></div>

  <!-- 图片放大遮罩 -->
  <div class="lightbox-overlay" id="lightbox" onclick="关闭放大()">
    <img id="lightbox-img" src="" alt="放大查看">
    <button class="lightbox-download-btn" onclick="event.stopPropagation(); 下载放大图片()">⬇ 下载图片</button>
  </div>

  <div class="header">
    <div class="header-logo">Mo:link Design</div>
    <div class="header-sub">艺术空间匹配服务</div>
  </div>

  <div class="panels-wrapper" id="panels-wrapper">
    <!-- 左侧：表单面板 -->
    <div class="form-panel" id="form-panel">

      <!-- 区域1: 服务类型选择（始终可见） -->
      <div class="section" id="section-service">
        <div class="section-title">服务类型选择</div>
        <div class="service-btns">
          <div class="service-btn" data-type="hang_in_home" onclick="选择服务(this)">
            <div class="icon">A</div>
            <div>作品挂进家</div>
          </div>
          <div class="service-btn" data-type="recommend_work" onclick="选择服务(this)">
            <div class="icon">B</div>
            <div>根据空间推荐作品</div>
          </div>
          <div class="service-btn" data-type="recommend_space" onclick="选择服务(this)">
            <div class="icon">C</div>
            <div>根据作品推荐空间</div>
          </div>
        </div>
      </div>

      <!-- 区域2: 图片上传 -->
      <div class="section" id="section-upload">
        <div class="section-title">图片上传</div>
        <div class="upload-row">
          <div class="upload-box disabled" id="upload-artwork" onclick="触发上传('artwork')">
            <input type="file" id="file-artwork" accept="image/*" onchange="处理上传(this, 'artwork')">
            <span class="plus">+</span>
            <span class="label">作品图片</span>
          </div>
          <div class="upload-box disabled" id="upload-space" onclick="触发上传('space')">
            <input type="file" id="file-space" accept="image/*" onchange="处理上传(this, 'space')">
            <span class="plus">+</span>
            <span class="label">空间图片</span>
          </div>
        </div>
        <div class="upload-description" id="upload-description"></div>
      </div>

      <!-- 区域3: 接收邮箱 -->
      <div class="section" id="section-receive">
        <div class="section-title">接收邮箱</div>
        <div class="email-input-area">
          <input type="email" id="receive-email" placeholder="请输入邮箱地址">
          <div class="email-hint">完成生成后我们将通过邮箱通知您</div>
        </div>
      </div>

      <!-- 区域4: 附加服务 -->
      <div class="section" id="section-extra">
        <div class="toggle-row">
          <div class="toggle-label">
            挂画后软装适配性微调
            <small>可选附加服务</small>
          </div>
          <div class="toggle-switch" id="extra-toggle" onclick="切换附加服务()"></div>
        </div>
      </div>

      <button class="submit-btn" id="submit-btn" disabled onclick="提交表单()">提交</button>

    </div>

    <!-- 右侧：交付结果面板 -->
    <div class="delivery-panel" id="delivery-panel">
      <div class="delivery-card" id="delivery-card-content">
        <!-- 动态填充 -->
      </div>
    </div>
  </div>

  <script>
    /* ==========================================
       设备 UUID 管理
       ========================================== */
    function 获取设备UUID() {
      let uuid = localStorage.getItem('molink_device_uuid');
      if (!uuid) {
        uuid = ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
          (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
        localStorage.setItem('molink_device_uuid', uuid);
      }
      return uuid;
    }

    const 设备UUID = 获取设备UUID();

    /* ==========================================
       视差滚动效果
       ========================================== */
    const parallaxBg = document.querySelector('.parallax-bg');
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    
    if (isMobile) {
      const viewportHeight = window.innerHeight;
      parallaxBg.style.height = `${viewportHeight * 2}px`;
    } else {
      function 更新背景高度() {
        const docHeight = document.documentElement.scrollHeight;
        parallaxBg.style.height = `${docHeight * 1.5}px`;
      }
      更新背景高度();
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(更新背景高度, 150);
      });
    }
    
    let ticking = false;
    let lastScrollY = 0;
    
    window.addEventListener('scroll', () => {
      lastScrollY = window.scrollY;
      if (!ticking) {
        window.requestAnimationFrame(() => {
          parallaxBg.style.transform = `translateY(${lastScrollY * 0.5}px)`;
          ticking = false;
        });
        ticking = true;
      }
    }, { passive: true });

    /* ==========================================
       Toast 通知系统
       ========================================== */
    function 显示Toast(message, icon = '✓') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span class="icon">${icon}</span><span>${message}</span><span class="close-toast">✕</span>`;
      container.appendChild(toast);

      function dismiss() {
        if (toast.parentNode) {
          toast.classList.add('fade-out');
          setTimeout(() => toast.remove(), 300);
        }
      }

      toast.addEventListener('click', dismiss);
      setTimeout(dismiss, 20000);
    }

    /* ==========================================
       鼠标跟踪悬停光晕
       ========================================== */
    document.querySelectorAll('.service-btn').forEach(btn => {
      btn.addEventListener('mousemove', (e) => {
        const rect = btn.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        btn.style.setProperty('--mouse-x', `${x}%`);
        btn.style.setProperty('--mouse-y', `${y}%`);
      });
    });

    /* ==========================================
       状态管理
       ========================================== */
    const 状态 = {
      服务类型: null,
      接收地址: '',
      附加服务: false,
      作品图文件: null,
      空间图文件: null,
      提交中: false,
      当前步骤: 1,
      当前订单ID: null,
      轮询定时器: null
    };

    /* ==========================================
       渐进式显示动画控制
       ========================================== */
    function 显示区域(sectionId, 回调) {
      const section = document.getElementById(sectionId);
      if (!section || section.classList.contains('visible')) {
        if (回调) 回调();
        return;
      }
      section.classList.add('visible');
      setTimeout(() => {
        const rect = section.getBoundingClientRect();
        const windowHeight = window.innerHeight;
        if (rect.bottom > windowHeight - 20) {
          section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        if (回调) setTimeout(回调, 300);
      }, 50);
    }

    /* ==========================================
       服务类型选择
       ========================================== */
    function 选择服务(btn) {
      document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      状态.服务类型 = btn.dataset.type;
      状态.当前步骤 = 2;

      清除上传('artwork');
      清除上传('space');

      const artworkBox = document.getElementById('upload-artwork');
      const spaceBox = document.getElementById('upload-space');

      if (状态.服务类型 === 'hang_in_home') {
        artworkBox.classList.remove('disabled');
        spaceBox.classList.remove('disabled');
      } else if (状态.服务类型 === 'recommend_work') {
        artworkBox.classList.add('disabled');
        spaceBox.classList.remove('disabled');
      } else if (状态.服务类型 === 'recommend_space') {
        artworkBox.classList.remove('disabled');
        spaceBox.classList.add('disabled');
      }

      显示区域('section-upload');
      更新上传说明();
      检查提交条件();
    }

    /* 更新上传说明文字 */
    function 更新上传说明() {
      const descBox = document.getElementById('upload-description');
      const 说明文本 = {
        'hang_in_home': '我们将把您上传的作品挂在空间图中最合适的位置，并推荐两幅同批展览中与所选作品相近的作品，呈现悬挂效果。',
        'recommend_work': '我们将基于专业的空间审美为您上传的空间推荐三幅适合的作品，并呈现悬挂效果。',
        'recommend_space': '我们将为您挑选的作品生成最适合它悬挂的三份室内设计参考，并呈现悬挂效果。'
      };

      const text = 说明文本[状态.服务类型];
      if (text) {
        descBox.textContent = text;
        descBox.classList.add('show');
      } else {
        descBox.classList.remove('show');
      }
    }

    /* ==========================================
       图片上传处理
       ========================================== */
    function 触发上传(type) {
      const box = document.getElementById(`upload-${type}`);
      if (box.classList.contains('disabled') || box.classList.contains('has-image')) return;
      document.getElementById(`file-${type}`).click();
    }

    function 处理上传(input, type) {
      const file = input.files[0];
      if (!file) return;

      const MAX_SIZE = 20 * 1024 * 1024; // 20MB
      if (file.size > MAX_SIZE) {
        显示Toast(`图片超过 20MB 限制（当前 ${(file.size / 1024 / 1024).toFixed(1)} MB），请压缩后重新选择`, '✗');
        input.value = '';
        return;
      }

      if (type === 'artwork') 状态.作品图文件 = file;
      else 状态.空间图文件 = file;

      const box = document.getElementById(`upload-${type}`);
      box.classList.add('has-image');

      const oldPreview = box.querySelector('img.preview');
      const oldRemove = box.querySelector('.remove-btn');
      if (oldPreview) oldPreview.remove();
      if (oldRemove) oldRemove.remove();

      const img = document.createElement('img');
      img.className = 'preview';
      img.src = URL.createObjectURL(file);
      box.appendChild(img);

      const removeBtn = document.createElement('div');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '×';
      removeBtn.onclick = (e) => {
        e.stopPropagation();
        清除上传(type);
      };
      box.appendChild(removeBtn);

      检查上传完成();
    }

    function 清除上传(type) {
      if (type === 'artwork') 状态.作品图文件 = null;
      else 状态.空间图文件 = null;

      const box = document.getElementById(`upload-${type}`);
      box.classList.remove('has-image');
      const preview = box.querySelector('img.preview');
      const removeBtn = box.querySelector('.remove-btn');
      if (preview) preview.remove();
      if (removeBtn) removeBtn.remove();

      document.getElementById(`file-${type}`).value = '';
      检查提交条件();
    }

    function 检查上传完成() {
      let 上传完成 = false;
      
      if (状态.服务类型 === 'hang_in_home') {
        上传完成 = 状态.作品图文件 && 状态.空间图文件;
      } else if (状态.服务类型 === 'recommend_work') {
        上传完成 = 状态.空间图文件;
      } else if (状态.服务类型 === 'recommend_space') {
        上传完成 = 状态.作品图文件;
      }

      if (上传完成 && 状态.当前步骤 === 2) {
        状态.当前步骤 = 3;
        显示区域('section-receive', () => {
          document.getElementById('receive-email').focus();
        });
      }
      
      检查提交条件();
    }

    /* ==========================================
       邮箱输入监听
       ========================================== */
    document.getElementById('receive-email').addEventListener('input', (e) => {
      状态.接收地址 = e.target.value.trim();
      检查邮箱完成();
    });

    function 检查邮箱完成() {
      if (状态.接收地址 && 状态.当前步骤 === 3) {
        状态.当前步骤 = 4;
        显示区域('section-extra', () => {
          document.getElementById('submit-btn').classList.add('visible');
        });
      }
      检查提交条件();
    }

    /* ==========================================
       附加服务开关
       ========================================== */
    function 切换附加服务() {
      状态.附加服务 = !状态.附加服务;
      document.getElementById('extra-toggle').classList.toggle('active', 状态.附加服务);
    }

    /* ==========================================
       提交条件检查
       ========================================== */
    function 检查提交条件() {
      let 可提交 = true;

      if (!状态.服务类型) 可提交 = false;
      if (!状态.接收地址) 可提交 = false;

      if (状态.服务类型 === 'hang_in_home') {
        if (!状态.作品图文件 || !状态.空间图文件) 可提交 = false;
      } else if (状态.服务类型 === 'recommend_work') {
        if (!状态.空间图文件) 可提交 = false;
      } else if (状态.服务类型 === 'recommend_space') {
        if (!状态.作品图文件) 可提交 = false;
      }

      document.getElementById('submit-btn').disabled = !可提交;
    }

    /* ==========================================
       Apple 风格旋转加载器
       ========================================== */
    function 创建Apple加载器() {
      let petals = '';
      for (let i = 0; i < 12; i++) {
        const rotation = i * 30;
        const delay = -(1 - i / 12);
        petals += `<div class="petal" style="transform: rotate(${rotation}deg); animation-delay: ${delay}s;"></div>`;
      }
      return `<div class="apple-spinner">${petals}</div>`;
    }

    /* ==========================================
       显示交付面板
       ========================================== */
    function 显示交付面板(内容HTML) {
      const panel = document.getElementById('delivery-panel');
      const cardContent = document.getElementById('delivery-card-content');
      cardContent.innerHTML = 内容HTML;
      panel.classList.add('visible');
      
      // 桌面端更新背景高度
      if (!isMobile) {
        setTimeout(() => {
          if (typeof 更新背景高度 === 'function') 更新背景高度();
        }, 700);
      }
    }

    /* 显示等待状态 */
    function 显示等待状态(serviceLabel) {
      const html = `
        <div class="apple-spinner-container">
          ${创建Apple加载器()}
          <div class="apple-spinner-text">${serviceLabel || '处理中'}</div>
        </div>
        <div class="delivery-hint">
          您可以退出当前页面，点击邮箱链接或重新扫码即可查看生成结果。<br>
          您可以在本界面等待或刷新以提交新的业务请求，并点击查看历史记录浏览所有的已生成内容。
        </div>
      `;
      显示交付面板(html);
    }

    /* 显示交付结果 */
    function 显示交付结果(data) {
      let imagesHtml = '';
      const images = data.images || data.Images || [];
      if (images.length > 0) {
        imagesHtml = `<div class="delivery-images">
          ${images.map((img, i) => `
            <div class="delivery-img-wrap" onclick="放大图片('/deliveries/${img}')">
              <img src="/deliveries/${img}" alt="交付图片" ${i === 0 ? 'onload="标记已查收()"' : ''} oncontextmenu="标记已下载()">
              <div class="delivery-img-hint">长按保存 · 点击放大</div>
            </div>
          `).join('')}
        </div>`;
      }

      const textContent = data.text || data.Text || '';
      let textHtml = '';
      if (textContent.trim()) {
        textHtml = `<div class="delivery-text-content">${textContent}</div>`;
      }

      // 获取历史记录链接
      const deliveryToken = localStorage.getItem('molink_active_order') ? JSON.parse(localStorage.getItem('molink_active_order')).deliveryToken : null;

      const html = `
        <div class="delivery-done-title">
          <div class="icon">✓</div>
          <h3>已完成</h3>
          <p>${data.serviceTypeLabel || data.service_type_label || ''}</p>
        </div>
        ${imagesHtml}
        ${textHtml}
        <button class="new-order-btn" onclick="提交新业务()">提交新的业务</button>
        ${deliveryToken ? `<button class="new-order-btn" style="margin-top:12px; background-image:linear-gradient(135deg, rgba(122,158,126,0.35) 0%, rgba(142,178,146,0.25) 50%, rgba(122,158,126,0.3) 100%); border-color:rgba(122,158,126,0.4);" onclick="window.location.href='/d/${deliveryToken}'">查看历史记录</button>` : ''}
      `;
      显示交付面板(html);
    }

    /* ==========================================
       图片放大
       ========================================== */
    function 放大图片(src) {
      const overlay = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      img.src = src;
      overlay.classList.add('active');
    }

    function 关闭放大() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function 下载放大图片() {
      const imgSrc = document.getElementById('lightbox-img').src;
      if (!imgSrc) return;
      
      // 创建临时链接下载
      const a = document.createElement('a');
      a.href = imgSrc;
      a.download = imgSrc.split('/').pop() || 'molink-image.jpg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      
      // 标记已下载
      标记已下载();
    }

    /* 标记已查收（图片加载时触发，仅调用一次） */
    let 已标记查收 = false;
    function 标记已查收() {
      if (已标记查收) return;
      if (状态.当前订单ID) {
        已标记查收 = true;
        fetch(`/api/client/mark-viewed/${状态.当前订单ID}`, { method: 'POST' }).catch(() => {});
      }
    }

    /* 标记已下载（长按保存触发，仅调用一次） */
    let 已标记下载 = false;
    function 标记已下载() {
      if (已标记下载) return;
      if (状态.当前订单ID) {
        已标记下载 = true;
        fetch(`/api/client/mark-downloaded/${状态.当前订单ID}`, { method: 'POST' }).catch(() => {});
      }
    }

    /* ==========================================
       提交表单
       ========================================== */
    async function 提交表单() {
      if (状态.提交中) return;
      状态.提交中 = true;

      const btn = document.getElementById('submit-btn');
      btn.innerHTML = '<span class="loading-spinner"></span>提交中...';
      btn.disabled = true;

      const formData = new FormData();
      formData.append('service_type', 状态.服务类型);
      formData.append('receive_target', 状态.接收地址);
      formData.append('extra_service', 状态.附加服务 ? '1' : '0');
      formData.append('device_uuid', 设备UUID);

      if (状态.作品图文件) formData.append('artwork', 状态.作品图文件);
      if (状态.空间图文件) formData.append('space', 状态.空间图文件);

      try {
        const resp = await fetch('/api/client/submit', {
          method: 'POST',
          body: formData
        });
        const data = await resp.json();

        if (data.success) {
          显示Toast('提交成功！处理完成后将通过邮箱通知您', '✓');
          状态.当前订单ID = data.orderId;
          
          // 缓存当前订单信息
          localStorage.setItem('molink_active_order', JSON.stringify({
            orderId: data.orderId,
            deliveryToken: data.deliveryToken,
            status: 'pending'
          }));

          // 显示等待面板
          显示等待状态('正在为您生成...');

          // 开始轮询
          开始轮询(data.orderId);
        } else {
          显示Toast(data.error || '提交失败，请重试', '✗');
        }
      } catch (err) {
        显示Toast('网络异常，请检查连接后重试', '✗');
        console.error(err);
      } finally {
        状态.提交中 = false;
        btn.textContent = '提交';
        检查提交条件();
      }
    }

    /* ==========================================
       轮询订单状态
       ========================================== */
    function 开始轮询(orderId) {
      if (状态.轮询定时器) clearInterval(状态.轮询定时器);

      状态.轮询定时器 = setInterval(async () => {
        try {
          const resp = await fetch(`/api/client/order-status/${orderId}`);
          const data = await resp.json();

          if (data.status === 'delivered') {
            clearInterval(状态.轮询定时器);
            状态.轮询定时器 = null;

            // 更新缓存
            localStorage.setItem('molink_active_order', JSON.stringify({
              orderId: orderId,
              status: 'delivered'
            }));

            显示交付结果(data);
          }
        } catch (e) {
          console.error('轮询异常:', e);
        }
      }, 8000); // 每8秒轮询一次
    }

    /* ==========================================
       提交新业务（重置）
       ========================================== */
    function 提交新业务() {
      // 清除缓存
      localStorage.removeItem('molink_active_order');
      
      // 隐藏交付面板
      document.getElementById('delivery-panel').classList.remove('visible');

      // 清除轮询
      if (状态.轮询定时器) {
        clearInterval(状态.轮询定时器);
        状态.轮询定时器 = null;
      }

      // 重置表单
      重置表单();
    }

    /* ==========================================
       重置表单
       ========================================== */
    function 重置表单() {
      状态.服务类型 = null;
      状态.接收地址 = '';
      状态.附加服务 = false;
      状态.作品图文件 = null;
      状态.空间图文件 = null;
      状态.当前步骤 = 1;
      状态.当前订单ID = null;

      document.querySelectorAll('.service-btn').forEach(b => b.classList.remove('active'));
      清除上传('artwork');
      清除上传('space');
      document.getElementById('upload-artwork').classList.add('disabled');
      document.getElementById('upload-space').classList.add('disabled');
      document.getElementById('receive-email').value = '';
      document.getElementById('extra-toggle').classList.remove('active');
      
      document.querySelectorAll('.section').forEach((s, i) => {
        if (i > 0) s.classList.remove('visible');
      });
      document.getElementById('submit-btn').classList.remove('visible');
      document.getElementById('submit-btn').disabled = true;
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ==========================================
       页面初始化：检查设备是否有活跃订单
       ========================================== */
    async function 初始化页面() {
      try {
        const resp = await fetch(`/api/client/device-status/${设备UUID}`);
        const data = await resp.json();

        if (data.hasActiveOrder) {
          if (data.status === 'pending' || data.status === 'processing') {
            状态.当前订单ID = data.orderId;
            显示等待状态(data.serviceTypeLabel || '正在为您生成...');
            开始轮询(data.orderId);
          } else if (data.status === 'delivered') {
            显示交付结果(data);
          }
        }
      } catch (e) {
        console.error('初始化检查设备状态失败:', e);
        // 静默失败，让用户正常使用表单
      }
    }

    // 页面加载后执行初始化
    初始化页面();
  </script>
</body>
</html>
