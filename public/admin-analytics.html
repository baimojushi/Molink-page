<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mo:link Design · 数据看板</title>
  <style>
    :root {
      --color-primary: #9B8370;
      --color-primary-light: #B5A091;
      --color-primary-dark: #806A54;
      --color-accent: #7a9e7e;
      --color-bg: #F5F0EB;
      --color-card: #ffffff;
      --color-border: #E5DDD5;
      --color-text-primary: #2a2a2a;
      --color-text-secondary: #5a5a5a;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--color-bg);
      color: var(--color-text-primary);
      min-height: 100vh;
    }
    .header {
      background: var(--color-primary-dark);
      color: #fff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .nav-links { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .nav-links a {
      display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 999px;
      background: rgba(255,255,255,0.16); color: #fff; text-decoration: none; font-size: 13px;
    }
    .nav-links a.active { background: rgba(255,255,255,0.28); }
    .toolbar {
      background: var(--color-card);
      padding: 16px 24px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--color-text-secondary); }
    .toolbar input {
      min-width: 180px;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font: inherit;
      background: #fff;
    }
    .toolbar button {
      padding: 10px 18px;
      background: var(--color-primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font: inherit;
    }
    .toolbar button:hover { background: var(--color-primary-dark); }
    .page { padding: 20px 24px 48px; }
    .section { margin-bottom: 22px; }
    .section-title {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      margin-bottom: 12px;
    }
    .section-title h2 { font-size: 18px; }
    .section-title p { font-size: 12px; color: var(--color-text-secondary); }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 18px rgba(128,106,84,0.06);
    }
    .card-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 8px; }
    .card-value { font-size: 28px; font-weight: 700; }
    .card-sub { margin-top: 8px; font-size: 12px; color: var(--color-text-secondary); }
    .panel {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--color-border); text-align: left; }
    th { background: #faf7f3; color: var(--color-text-secondary); font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .muted { color: var(--color-text-secondary); }
    .empty { padding: 18px; color: var(--color-text-secondary); font-size: 13px; }
    .inline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .metric-box {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 16px;
    }
    .metric-box h3 { font-size: 14px; margin-bottom: 10px; }
    .metric-list { display: grid; gap: 8px; font-size: 13px; }
    .metric-row { display: flex; justify-content: space-between; gap: 12px; }
    .loading, .error {
      padding: 24px;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      color: var(--color-text-secondary);
    }
    .note-box {
      margin-top: 12px;
      background: #faf7f3;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.7;
    }
    .note-box strong {
      color: var(--color-text-primary);
    }
    .with-tip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      line-height: 1.4;
    }
    .info-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid #d8cabb;
      background: #f4ebe2;
      color: var(--color-primary-dark);
      font-size: 11px;
      font-weight: 700;
      cursor: help;
      flex: 0 0 auto;
    }
    .info-icon::before {
      content: '¡';
      line-height: 1;
      transform: translateY(-0.5px);
    }
    .card-label .with-tip,
    th .with-tip,
    .metric-row .with-tip {
      align-items: center;
    }
    .global-tooltip {
      position: fixed;
      left: 0;
      top: 0;
      width: min(280px, calc(100vw - 24px));
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(42, 42, 42, 0.96);
      color: #fff;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.6;
      text-align: left;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.12s ease;
      white-space: normal;
    }
    .global-tooltip.visible { opacity: 1; }
    .cell-detail {
      margin-top: 4px;
      color: var(--color-text-secondary);
      font-size: 12px;
      line-height: 1.5;
    }
    .cell-detail span { display: inline-block; margin-right: 10px; }
    .viz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    .viz-panel {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 18px rgba(128,106,84,0.06);
      min-height: 160px;
    }
    .viz-panel h3 {
      font-size: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bar-list { display: grid; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: minmax(92px, 160px) 1fr auto; align-items: center; gap: 10px; font-size: 12px; }
    .bar-label { color: var(--color-text-secondary); line-height: 1.4; }
    .bar-track { height: 10px; border-radius: 999px; background: #efe7df; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--color-primary-light), var(--color-primary-dark)); min-width: 2px; }
    .bar-value { font-weight: 600; color: var(--color-text-primary); white-space: nowrap; }
    .trend-wrap { overflow-x: auto; padding-bottom: 4px; }
    .trend-bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(52px, 1fr); gap: 10px; align-items: end; min-height: 190px; }
    .trend-day { display: grid; grid-template-rows: 1fr auto; gap: 8px; min-width: 52px; }
    .trend-stack { height: 145px; display: flex; align-items: end; justify-content: center; gap: 4px; border-bottom: 1px solid var(--color-border); }
    .trend-bar { width: 10px; min-height: 2px; border-radius: 8px 8px 0 0; background: var(--color-primary); }
    .trend-bar.delivered { background: var(--color-accent); }
    .trend-bar.downloaded { background: var(--color-primary-dark); }
    .trend-label { text-align: center; font-size: 11px; color: var(--color-text-secondary); white-space: nowrap; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 12px; color: var(--color-text-secondary); }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--color-primary); }
    .legend-dot.delivered { background: var(--color-accent); }
    .legend-dot.downloaded { background: var(--color-primary-dark); }
    .funnel-visual { display: grid; gap: 10px; }
    .funnel-row { display: grid; grid-template-columns: minmax(110px, 170px) 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
    .funnel-track { height: 18px; border-radius: 999px; background: #efe7df; overflow: hidden; }
    .funnel-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--color-primary-light), var(--color-primary-dark)); min-width: 2px; }
    .branch-funnel { display: grid; gap: 12px; }
    .branch-group { display: grid; gap: 8px; }
    .branch-title, .branch-merge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 4px 10px;
      border-radius: 999px;
      background: #faf7f3;
      color: var(--color-primary-dark);
      font-size: 12px;
      font-weight: 700;
    }
    .branch-group-scan .funnel-fill { background: linear-gradient(90deg, #cbbba9, #9b8370); }
    .branch-funnel-row { display: grid; grid-template-columns: minmax(124px, 178px) 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
    .branch-funnel-row.muted-row .funnel-fill { opacity: 0.7; }
    .branch-note { margin-top: 3px; color: var(--color-text-secondary); font-size: 11px; line-height: 1.35; }
    .branch-merge { justify-self: center; position: relative; background: #efe7df; }
    @media print {
      body { background: #fff; }
      .header, .toolbar, .global-tooltip { display: none !important; }
      .page { padding: 0; }
      .section { break-inside: avoid; page-break-inside: avoid; margin-bottom: 16px; }
      .card, .metric-box, .panel, .viz-panel { box-shadow: none; }
    }

  </style>
</head>
<body>
  <div id="global-tooltip" class="global-tooltip" role="tooltip"></div>
  <div class="header">
    <h1>Mo:link Design 数据看板</h1>
    <div class="nav-links">
      <a id="orders-link" href="/admin">订单管理</a>
      <a class="active" id="analytics-link" href="/admin/analytics">数据看板</a>
      <a id="artworks-link" href="/admin/artworks">作品库管理</a>
      <a id="llm-debug-link" href="/admin/llm-debug">LLM Prompt调试</a>
    </div>
  </div>

  <div class="toolbar">
    <div class="field">
      <label>管理密钥</label>
      <input id="admin-secret" type="password" placeholder="请输入管理密钥">
    </div>
    <div class="field">
      <label>开始日期</label>
      <input id="start-date" type="date">
    </div>
    <div class="field">
      <label>结束日期</label>
      <input id="end-date" type="date">
    </div>
    <button onclick="加载看板()">刷新看板</button>
    <button type="button" onclick="导出PDF()">导出PDF</button>
  </div>

  <div class="page">
    <div id="content" class="loading">请输入管理密钥并选择日期范围后加载看板。</div>
  </div>

  <script src="/admin-exhibition-scope.js"></script>
  <script>
    const 管理密钥存储键 = 'molink_admin_secret';
    let 当前数据 = null;

    function 获取预填密钥() {
      const querySecret = new URLSearchParams(window.location.search).get('secret');
      return querySecret || localStorage.getItem(管理密钥存储键) || '';
    }

    function 持久化管理密钥(secret) {
      if (!secret) return;
      localStorage.setItem(管理密钥存储键, secret);
      更新导航(secret);
    }

    function 更新导航(secret) {
      const suffix = secret ? `?secret=${encodeURIComponent(secret)}` : '';
      document.getElementById('orders-link').href = `/admin${suffix}`;
      document.getElementById('analytics-link').href = `/admin/analytics${suffix}`;
      document.getElementById('artworks-link').href = `/admin/artworks${suffix}`;
      document.getElementById('llm-debug-link').href = `/admin/llm-debug${suffix}`;
    }

    function 默认日期(offsetDays = 0) {
      const date = new Date();
      date.setDate(date.getDate() + offsetDays);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function 格式化数字(value) {
      return Number(value || 0).toLocaleString('zh-CN');
    }

    function 格式化百分比(value) {
      return `${(Number(value || 0) * 100).toFixed(1)}%`;
    }

    function 格式化短日期(value) {
      const text = String(value || '');
      if (text.length >= 10) return text.slice(5, 10).replace('-', '/');
      return text;
    }

    function 限制百分比(value) {
      const number = Number(value || 0);
      if (!Number.isFinite(number)) return 0;
      return Math.max(0, Math.min(100, number));
    }

    function 导出PDF() {
      window.print();
    }

    function 格式化时长(ms) {
      const value = Number(ms || 0);
      if (!value) return '0秒';
      const totalSeconds = Math.round(value / 1000);
      if (totalSeconds < 60) return `${totalSeconds}秒`;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      if (minutes < 60) return `${minutes}分${seconds}秒`;
      const hours = Math.floor(minutes / 60);
      const remainMinutes = minutes % 60;
      return `${hours}小时${remainMinutes}分`;
    }

    function 转义HTML(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function 提示图标(text) {
      const safeText = 转义HTML(text);
      return `<span class="info-icon" tabindex="0" aria-label="${safeText}" data-tip="${safeText}"></span>`;
    }

    function 带提示标签(label, tip) {
      return `<span class="with-tip">${label}${提示图标(tip)}</span>`;
    }

    function 显示全局提示(icon) {
      const tooltip = document.getElementById('global-tooltip');
      if (!tooltip || !icon) return;
      const text = icon.getAttribute('data-tip') || '';
      if (!text) return;

      tooltip.textContent = text;
      tooltip.classList.add('visible');

      const rect = icon.getBoundingClientRect();
      const tooltipRect = tooltip.getBoundingClientRect();
      const margin = 12;
      let left = rect.left + rect.width / 2 - tooltipRect.width / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - tooltipRect.width - margin));

      let top = rect.top - tooltipRect.height - 10;
      if (top < margin) top = rect.bottom + 10;
      if (top + tooltipRect.height > window.innerHeight - margin) {
        top = Math.max(margin, window.innerHeight - tooltipRect.height - margin);
      }

      tooltip.style.left = `${Math.round(left)}px`;
      tooltip.style.top = `${Math.round(top)}px`;
    }

    function 隐藏全局提示() {
      const tooltip = document.getElementById('global-tooltip');
      if (!tooltip) return;
      tooltip.classList.remove('visible');
    }

    function 初始化提示浮窗() {
      document.querySelectorAll('.info-icon').forEach(icon => {
        icon.onmouseenter = () => 显示全局提示(icon);
        icon.onmouseleave = 隐藏全局提示;
        icon.onfocus = () => 显示全局提示(icon);
        icon.onblur = 隐藏全局提示;
      });
    }

    function 渲染水平条列表(rows, options = {}) {
      const list = Array.isArray(rows) ? rows : [];
      const maxValue = Math.max(1, ...list.map(item => Number(item.value || item.count || 0)));
      if (!list.length) return '<div class="empty">暂无数据</div>';
      return `<div class="bar-list">${list.map(item => {
        const value = Number(item.value || item.count || 0);
        const width = 限制百分比(value / maxValue * 100);
        const valueText = item.value_text || 格式化数字(value);
        const subText = item.ratio !== undefined ? ` · ${格式化百分比(item.ratio)}` : '';
        return `
          <div class="bar-row">
            <div class="bar-label">${转义HTML(item.label || '')}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
            <div class="bar-value">${valueText}${subText}</div>
          </div>
        `;
      }).join('')}</div>`;
    }

    function 渲染趋势柱图(daily) {
      const rows = Array.isArray(daily) ? daily : [];
      if (!rows.length) return '<div class="empty">暂无趋势数据</div>';
      const maxValue = Math.max(1, ...rows.flatMap(item => [item.submit_count, item.delivered_count, item.downloaded_count].map(v => Number(v || 0))));
      return `
        <div class="trend-wrap">
          <div class="trend-bars">
            ${rows.map(item => {
              const submitHeight = 限制百分比(Number(item.submit_count || 0) / maxValue * 100);
              const deliveredHeight = 限制百分比(Number(item.delivered_count || 0) / maxValue * 100);
              const downloadedHeight = 限制百分比(Number(item.downloaded_count || 0) / maxValue * 100);
              return `
                <div class="trend-day" title="${转义HTML(item.date)}：提交 ${格式化数字(item.submit_count)}，交付 ${格式化数字(item.delivered_count)}，下载 ${格式化数字(item.downloaded_count)}">
                  <div class="trend-stack">
                    <div class="trend-bar" style="height:${submitHeight}%"></div>
                    <div class="trend-bar delivered" style="height:${deliveredHeight}%"></div>
                    <div class="trend-bar downloaded" style="height:${downloadedHeight}%"></div>
                  </div>
                  <div class="trend-label">${格式化短日期(item.date)}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
        <div class="legend">
          <span class="legend-item"><span class="legend-dot"></span>提交</span>
          <span class="legend-item"><span class="legend-dot delivered"></span>交付</span>
          <span class="legend-item"><span class="legend-dot downloaded"></span>下载</span>
        </div>
      `;
    }

    function 渲染核心分支漏斗(steps) {
      const list = Array.isArray(steps) ? steps.filter(Boolean) : [];
      if (!list.length) return '<div class="empty">暂无漏斗数据</div>';

      const byKey = new Map(list.map(step => [step.step_key, step]));
      const uploadStep = byKey.get('upload_page_view') || {};
      const uploadBranches = Array.isArray(uploadStep.branches) ? uploadStep.branches : [];
      const servicePathBranch = uploadBranches.find(branch => branch.key === 'service_path') || { label: '服务路径进入', count: 0 };
      const scanDirectBranch = uploadBranches.find(branch => branch.key === 'scan_direct') || { label: '扫码直达上传页', count: 0 };

      const servicePathSteps = [
        byKey.get('service_selected'),
        byKey.get('service_next_clicked'),
        Object.assign({}, uploadStep, {
          label: servicePathBranch.label || '服务路径进入上传页',
          count: Number(servicePathBranch.count || 0),
          branch_note: uploadStep.conversion_label || ''
        })
      ].filter(Boolean);

      const mergedKeys = ['upload_page_view', 'required_input_ready', 'submit_clicked', 'submit_success', 'waiting_view', 'delivered', 'result_view', 'image_download'];
      const mergedSteps = mergedKeys.map(key => byKey.get(key)).filter(Boolean);
      const maxValue = Math.max(1, ...[...servicePathSteps, scanDirectBranch, ...mergedSteps].map(step => Number(step.count || 0)));

      const renderRow = (step, options = {}) => {
        const count = Number(step && step.count || 0);
        const width = 限制百分比(count / maxValue * 100);
        const note = options.note || step.branch_note || '';
        return `
          <div class="branch-funnel-row ${options.muted ? 'muted-row' : ''}">
            <div class="bar-label">${转义HTML(step.label || '')}${note ? `<div class="branch-note">${转义HTML(note)}</div>` : ''}</div>
            <div class="funnel-track"><div class="funnel-fill" style="width:${width}%"></div></div>
            <div class="bar-value">${格式化数字(count)}</div>
          </div>
        `;
      };

      return `
        <div class="branch-funnel">
          <div class="branch-group">
            <div class="branch-title">服务路径</div>
            ${servicePathSteps.map(step => renderRow(step)).join('')}
          </div>
          <div class="branch-group branch-group-scan">
            <div class="branch-title">扫码直达路径</div>
            ${renderRow({ label: scanDirectBranch.label || '扫码直达上传页', count: Number(scanDirectBranch.count || 0) }, { note: '无上一环节，不参与服务点击转化率计算', muted: true })}
          </div>
          <div class="branch-merge">合并后的体验链路</div>
          <div class="branch-group">
            ${mergedSteps.map(step => renderRow(step)).join('')}
          </div>
        </div>
      `;
    }

    function 渲染投资人快照(data) {
      const summary = data.investor_summary || {};
      const trend = data.trend_series || { daily: [] };
      const funnel = data.experience_funnel || {};
      const total = funnel.total || { steps: [] };
      return `
        <div class="section">
          <div class="section-title">
            <h2>投资人运营快照</h2>
            <p>按当前日期范围生成，支持浏览器打印为 PDF</p>
          </div>
          <div class="cards">
            ${[
              ['有效完成数', 格式化数字(summary.effective_completed_count), '已交付且用户查收或下载的订单数，用于代表用户真实感知到结果的完成量。'],
              ['有效完成率', 格式化百分比(summary.effective_completion_rate), '公式：有效完成数 / 提交量。'],
              ['整体交付率', 格式化百分比(summary.delivery_rate), '公式：交付量 / 提交量。'],

    function 渲染转化漏斗(data) {
      const funnel = data.experience_funnel || {};
      const total = funnel.total || { steps: [] };
      const services = Array.isArray(funnel.services) ? funnel.services : [];
      const hang = services.find(item => item.service_type === 'hang_in_home') || { steps: [] };
      const recommend = services.find(item => item.service_type === 'recommend_work') || { steps: [] };
      const diagnostics = Array.isArray(funnel.diagnostics) ? funnel.diagnostics : [];
      const entryMethods = Array.isArray(funnel.miniapp_entry_methods) ? funnel.miniapp_entry_methods : [];
      const getStep = (group, index) => (group.steps && group.steps[index]) || {};
      const 渲染分支明细 = step => {
        if (!step || step.step_key !== 'upload_page_view' || !Array.isArray(step.branches)) return '';
        const branchHtml = step.branches.map(branch => {
          if (branch.key === 'service_path') {
            return `<span>${branch.label}：${格式化数字(branch.count)}</span>`;
          }
          return `<span>${branch.label}：${格式化数字(branch.count)}（无上一环节）</span>`;
        }).join('');
        const excluded = Number(step.excluded_upload_scan_button_reentry_count || 0);
        const excludedHtml = excluded > 0 ? `<span>作品检索旁扫码回到上传页：${格式化数字(excluded)}（不重复计入该层）</span>` : '';
        return `<div class="cell-detail">${branchHtml}${excludedHtml}</div>`;
      };
      const 渲染转化率 = (step, index) => {
        if (index === 0) return '—';
        if (step && step.step_key === 'upload_page_view') {
          return step.conversion_label || '—';
        }
        return 格式化百分比(step.conversion_rate);
      };
      const 渲染流失量 = (step, index) => {
        if (index === 0) return '—';
        if (step && step.step_key === 'upload_page_view') {
          return step.loss_label || '—';
        }
        return 格式化数字(step.loss_count);
      };
      const rows = (total.steps || []).map((step, index) => {
        const hangStep = getStep(hang, index);
        const recommendStep = getStep(recommend, index);
        return `
          <tr>
            <td>${带提示标签(step.label, step.tip || '')}</td>
            <td>${格式化数字(step.count)}${渲染分支明细(step)}</td>
            <td>${渲染转化率(step, index)}</td>
            <td>${渲染流失量(step, index)}</td>
            <td>${格式化数字(hangStep.count)}${渲染分支明细(hangStep)}</td>
            <td>${格式化数字(recommendStep.count)}${渲染分支明细(recommendStep)}</td>
          </tr>
        `;
      }).join('');

      const diagnosticRows = diagnostics.map(item => `
        <tr>
          <td>${带提示标签(item.label, item.tip || '')}</td>
          <td>${格式化数字(item.count)}</td>
        </tr>
      `).join('');

      const entryMethodRows = entryMethods.map(item => `
        <tr>
          <td>${带提示标签(item.method_label || item.method, item.tip || '')}</td>
          <td>${格式化数字(item.count)}</td>
          <td>${格式化百分比(item.ratio)}</td>
        </tr>
      `).join('');

      return `
        <div class="section">
          <div class="section-title">
            <h2>服务体验转化漏斗</h2>
            <p>定位用户从进入小程序、服务点击到查收下载的流失环节</p>
          </div>
          ${entryMethodRows ? `
            <div class="section-title" style="margin-top:0;">
              <h2>小程序进入方式</h2>
              <p>按微信启动 scene 归类，优先使用小程序已有入口变量</p>
            </div>
            <div class="panel">
              <table>
                <thead>
                  <tr>
                    <th>${带提示标签('进入方式', '来源：app_events.miniapp_entry 的 entry_source。由小程序启动参数 scene 直接归类，不新增订单字段。')}</th>
                    <th>${带提示标签('进入次数', '用户通过该方式进入小程序的次数。用于判断服务漏斗最前端的来源结构。')}</th>
                    <th>${带提示标签('占比', '公式：该进入方式次数 / 三类已识别小程序进入方式总次数。')}</th>
                  </tr>
                </thead>
                <tbody>${entryMethodRows}</tbody>
              </table>
            </div>
          ` : ''}
          <div class="panel">
            <table>
              <thead>
                <tr>
                  <th>${带提示标签('漏斗环节', '按服务体验顺序排列。前半段来自 app_events，提交成功及以后优先来自 orders。')}</th>
                  <th>${带提示标签('总体到达量', '该环节在当前筛选范围内的到达次数或订单数。进入上传页这一层会拆成“服务路径进入”和“扫码直达上传页”两个分支。')}</th>
                  <th>${带提示标签('上一环节转化率', '一般公式：当前环节到达量 / 上一环节到达量。进入上传页层例外：只计算“服务路径进入上传页 / 确认进入上传”，扫码直达上传页没有上一环节，不参与该比例。')}</th>
                  <th>${带提示标签('上一环节流失量', '一般公式：上一环节到达量 - 当前环节到达量。进入上传页层只展示服务路径的流失，扫码直达上传页没有上一环节，不计流失。')}</th>
                  <th>${带提示标签('作品挂进家', '仅统计 service_type = hang_in_home 的该环节到达量。')}</th>
                  <th>${带提示标签('为空间推荐作品', '仅统计 service_type = recommend_work 的该环节到达量。')}</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <div class="note-box">
            <div><strong>简单说明：</strong>小程序进入方式用于看漏斗最前端用户从哪里来，包括扫小程序页面码、扫小程序普通二维码、通过微信分享进入。</div>
            <div>进入上传页这一层分为“服务路径进入”和“扫码直达上传页”。扫码直达没有上一环节，所以不再用进入上传页总量除以前面的服务路径数量，避免出现 333% 这类误导性转化率。</div>
            <div>服务路径会先看“服务点击 → 确认进入上传 → 进入上传页”；从“完成必填输入”开始，上一环节分母使用进入上传页这一层的合计。看后续“上一环节流失量”和“上一环节转化率”即可定位卡点。</div>
            <div>前半段是行为事件口径，提交成功以后是订单结果口径，因此它适合判断趋势和流失位置，不建议和财务结算口径混用。</div>
          </div>
          ${diagnosticRows ? `
            <div class="section-title" style="margin-top:14px;">
              <h2>流失辅助诊断</h2>
              <p>解释为什么没有继续完成下一步</p>
            </div>
            <div class="panel">
              <table>
                <thead><tr><th>异常 / 拦截事件</th><th>次数</th></tr></thead>
                <tbody>${diagnosticRows}</tbody>
              </table>
            </div>
          ` : ''}
        </div>
      `;
    }

      return `

                </thead>
                <tbody>
                  <tr><td>${带提示标签('审核对象', '作品挂进家审核对象是 AI 生成后的交付效果图是否通过系统审核。')}</td><td>${hang.review_name || 'AI交付图系统审核通过率'}</td></tr>
                  <tr><td>${带提示标签('提交订单数', '来源：orders。统计 service_type=hang_in_home 且 created_at 命中范围的成功订单数，包含审核拒绝订单。')}</td><td>${格式化数字(hang.submit_count)}</td></tr>
                  <tr><td>${带提示标签('审核拒绝订单量', '来源：orders.status = audit_rejected 或 content_review_status = rejected。')}</td><td>${格式化数字(hang.audit_rejected_count)}</td></tr>
                  <tr><td>${带提示标签(hang.denominator_label || 'AI提交订单数', '来源：orders.ai_submitted_at。只有已成功提交 AI 生图的订单才进入该审核通过率分母。')}</td><td>${格式化数字(hang.denominator_count)}</td></tr>
                  <tr><td>${带提示标签(hang.numerator_label || '系统审核通过订单数', '来源：orders.ai_ready_at。AI 结果通过系统审核并进入 ai_ready 的订单数。')}</td><td>${格式化数字(hang.numerator_count)}</td></tr>
                  <tr><td>${带提示标签('审核通过率', '公式：系统审核通过订单数 / AI提交订单数。')}</td><td><strong>${格式化百分比(hang.rate)}</strong></td></tr>
                </tbody>
              </table>
            </div>
            <div class="panel">
              <table>
                <thead>
                  <tr><th colspan="2">${带提示标签('根据空间推荐作品审核通过率', recommend.tip || '根据空间推荐作品的审核对象是用户上传的空间输入图。')}</th></tr>
                </thead>
                <tbody>
                  <tr><td>${带提示标签('审核对象', '根据空间推荐作品的第一道审核对象是用户上传的空间输入图。订单先创建，审核通过后进入人工推荐队列。')}</td><td>${recommend.review_name || '空间输入图审核通过率'}</td></tr>
                  <tr><td>${带提示标签(recommend.denominator_label || '输入图审核尝试数', '来源：orders。分母 = 该服务成功创建的全部订单。')}</td><td>${格式化数字(recommend.denominator_count)}</td></tr>
                  <tr><td>${带提示标签(recommend.numerator_label || '输入图审核通过订单数', '来源：orders。已创建且未被内容安全审核拒绝的 recommend_work 订单。')}</td><td>${格式化数字(recommend.numerator_count)}</td></tr>
                  <tr><td>${带提示标签('审核拒绝订单量', '来源：orders.status = audit_rejected 或 content_review_status = rejected。')}</td><td>${格式化数字(recommend.failed_count)}</td></tr>
                  <tr><td>${带提示标签('审核通过率', '公式：输入图审核通过订单数 / 输入图审核尝试数。')}</td><td><strong>${格式化百分比(recommend.rate)}</strong></td></tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="panel" style="margin-top:12px;">
            <table>
              <thead>
                <tr>
                  <th>${带提示标签('总通过率', total.tip || '按两个服务各自审核口径加权计算的总通过率。')}</th>
                  <th>${带提示标签('通过数合计', '作品挂进家系统审核通过订单数 + 根据空间推荐作品输入图审核通过订单数。')}</th>
                  <th>${带提示标签('审核对象合计', '作品挂进家AI提交订单数 + 根据空间推荐作品输入图审核尝试数。')}</th>
                  <th>${带提示标签('通过率', '公式：通过数合计 / 审核对象合计。由于两个服务审核对象不同，该指标是加权总览，细看仍应分别看两个服务表。')}</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>按各自口径加权</td>
                  <td>${格式化数字(total.numerator_count)}</td>
                  <td>${格式化数字(total.denominator_count)}</td>
                  <td><strong>${格式化百分比(total.rate)}</strong></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="note-box">
            <div><strong>简单说明：</strong>作品挂进家的审核通过率看 AI 生图后是否通过系统审核进入 <strong>ai_ready</strong>；根据空间推荐作品的审核通过率看用户上传空间图是否通过内容安全审核。审核拒绝订单会留在后台订单列表，并计入提交量。</div>
            <div>两个服务的审核对象不同，因此不再放进服务看板同一列，避免把 <strong>ai_ready</strong> 和 <strong>输入图审核</strong> 混为一个指标。</div>
          </div>
        </div>
      `;
    }

    function 渲染作品选定方式(data) {
      const rows = Array.isArray(data.artwork_selection_methods) ? data.artwork_selection_methods : [];
      const total = Number(data.artwork_selection_total || 0);
      if (!rows.length || total <= 0) {
        return `
          <div class="section">
            <div class="section-title"><h2>作品选定方式</h2><p>当前范围暂无已记录数据</p></div>
            <div class="panel"><div class="empty">暂无通过作品选定方式提交的订单。</div></div>
          </div>
        `;
      }
      return `
        <div class="section">
          <div class="section-title">
            <h2>作品选定方式</h2>
            <p>按提交前最终一次确定作品的方法统计</p>
          </div>
          <div class="viz-grid" style="margin-bottom:12px;">
            <div class="viz-panel">
              <h3>${带提示标签('选定方式占比', '按提交成功订单的最终作品选定方式展示数量和占比。')}</h3>
              ${渲染水平条列表(rows.map(item => ({ label: item.method_label, value: item.order_count, ratio: item.ratio })))}
            </div>
          </div>
          <div class="panel">
            <table>
              <thead>
                <tr>
                  <th>${带提示标签('选定方式', '只记录提交前最终一次确定作品的方法。中途切换过方式时，以最后一次选定并提交成功的方法为准。')}</th>
                  <th>${带提示标签('订单数量', '来源：orders.artwork_selection_method。统计范围内，带有该选定方式并成功创建的订单数。')}</th>
                  <th>${带提示标签('数量占比', '公式：该选定方式订单数 / 已记录作品选定方式的订单总数。仅在四种已定义方式之间计算占比。')}</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(item => `
                  <tr>
                    <td>${item.method_label}</td>
                    <td>${格式化数字(item.order_count)}</td>
                    <td>${格式化百分比(item.ratio)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          <div class="note-box">
            <div><strong>简单说明：</strong>这里只看最终提交成功的订单。用户如果先扫码、后又改成搜索或列表选择，最终会归到最后一次选定作品的方法。</div>
            <div>当前覆盖四种方式：现场扫小程序码选定、搜索选定作品、滑动作品列表选定、作品检索旁扫码按钮选定。已记录订单总数：<strong>${格式化数字(total)}</strong>。</div>
          </div>
        </div>
      `;
    }

    function 渲染作品库(data) {
      if (!data.artworks.length) {
        return `
          <div class="section">
            <div class="section-title"><h2>作品库表现看板</h2><p>当前范围暂无数据</p></div>
            <div class="panel"><div class="empty">暂无作品提交或扫码进入数据。</div></div>
          </div>
        `;
      }
      return `
        <div class="section">
          <div class="section-title">
            <h2>作品库表现看板</h2>
            <p>按 artwork_code 聚合</p>
          </div>
          <div class="viz-grid" style="margin-bottom:12px;">
            <div class="viz-panel">
              <h3>${带提示标签('作品被选中 Top 10', '按作品被选中并提交成功的订单数排序。')}</h3>
              ${渲染水平条列表(data.artworks.slice(0, 10).map(item => ({ label: item.artwork_name || item.artwork_code, value: item.selected_submit_count })))}
            </div>
            <div class="viz-panel">
              <h3>${带提示标签('作品下载 Top 10', '按对应订单下载次数排序，反映结果消费较强的作品。')}</h3>
              ${渲染水平条列表([...data.artworks].sort((a, b) => Number(b.downloaded_order_count || 0) - Number(a.downloaded_order_count || 0)).slice(0, 10).map(item => ({ label: item.artwork_name || item.artwork_code, value: item.downloaded_order_count, ratio: item.download_rate })))}
            </div>
          </div>
          <div class="panel">
            <table>
              <thead>
                <tr>
                  <th>${带提示标签('作品编码', '来源：orders.artwork_code 与 app_events.artwork_code，作为作品聚合键。')}</th>
                  <th>${带提示标签('作品名称', '来源：orders.artwork_name。展示该作品编码对应订单里记录的作品名称。')}</th>
                  <th>${带提示标签('被选中提交次数', '来源：orders。按 artwork_code 聚合，统计 created_at 命中范围且 artwork_code 非空的订单数。')}</th>
                  <th>${带提示标签('对应订单下载次数', '来源：orders.downloaded_at。按 artwork_code 聚合，统计 downloaded_at 非空的订单数。')}</th>
                  <th>${带提示标签('按作品下载率', '公式：downloaded_order_count / selected_submit_count。按订单数计算，不按下载动作次数计算。')}</th>
                  <th>${带提示标签('扫码进入次数', '来源：app_events。统计 event_name = scan_entry_view 且 artwork_code 匹配的事件次数。')}</th>
                </tr>
              </thead>
              <tbody>
                ${data.artworks.map(item => `
                  <tr>
                    <td>${item.artwork_code || ''}</td>
                    <td>${item.artwork_name || ''}</td>
                    <td>${格式化数字(item.selected_submit_count)}</td>
                    <td>${格式化数字(item.downloaded_order_count)}</td>
                    <td>${格式化百分比(item.download_rate)}</td>
                    <td>${格式化数字(item.scan_entry_count)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function 渲染运营效率(data) {
      const operations = data.operations;
      const review = data.human_review;
      return `
        <div class="section">
          <div class="section-title">
            <h2>运营效率看板</h2>
            <p>时长基于订单创建时间口径</p>
          </div>
          <div class="inline-grid">
            <div class="metric-box">
              <h3>时长指标</h3>
              <div class="metric-list">
                <div class="metric-row"><span class="muted">${带提示标签('提交到 AI 提交', '来源：orders.created_at、orders.ai_submitted_at。对同时存在这两个时间的订单，计算 ai_submitted_at - created_at 的平均值。')}</span><strong>${格式化时长(operations.avg_submit_to_ai_ms)}</strong></div>
                <div class="metric-row"><span class="muted">${带提示标签('AI 提交到 AI ready', '来源：orders.ai_submitted_at、orders.ai_ready_at。对同时存在这两个时间的订单，计算 ai_ready_at - ai_submitted_at 的平均值。')}</span><strong>${格式化时长(operations.avg_ai_to_ready_ms)}</strong></div>
                <div class="metric-row"><span class="muted">${带提示标签('AI ready 到交付', '来源：orders.ai_ready_at、orders.delivered_at。对同时存在这两个时间的订单，计算 delivered_at - ai_ready_at 的平均值。')}</span><strong>${格式化时长(operations.avg_ready_to_delivered_ms)}</strong></div>
                <div class="metric-row"><span class="muted">${带提示标签('提交到交付总时长', '来源：orders.created_at、orders.delivered_at。对已交付订单，计算 delivered_at - created_at 的平均值。')}</span><strong>${格式化时长(operations.avg_total_ms)}</strong></div>
                <div class="metric-row"><span class="muted">${带提示标签('P50 / P90', '来源：已交付订单的提交到交付总时长。P50 是 50 分位，P90 是 90 分位。')}</span><strong>${格式化时长(operations.p50_total_ms)} / ${格式化时长(operations.p90_total_ms)}</strong></div>
                <div class="metric-row"><span class="muted">${带提示标签('重生成次数', '来源：orders.admin_regenerate_count 求和。按管理员触发重新生成的动作次数统计。')}</span><strong>${格式化数字(operations.regenerate_count)}</strong></div>
              </div>
            </div>
            <div class="metric-box">
              <h3>AI 生图人工审核通过率</h3>
              <div class="metric-list">
                <div class="metric-row"><span class="muted">${带提示标签('人工审核通过次数', '来源：orders.admin_approve_count 求和。按管理员点击通过的动作次数统计，不按订单去重。')}</span><strong>${格式化数字(review.admin_approve_count)}</strong></div>
                <div class="metric-row"><span class="muted">${带提示标签('AI 首次生图数', '来源：orders.ai_first_ready_count 求和。表示首次生成后进入 ai_ready 的效果图张数，不含重生成批次。')}</span><strong>${格式化数字(review.initial_image_count)}</strong></div>
                <div class="metric-row"><span class="muted">${带提示标签('全部人工审核决策图片数', '来源：orders.ai_total_ready_count 求和。表示全部批次进入 ai_ready 的效果图张数，包含首次生成和重生成。')}</span><strong>${格式化数字(review.total_human_review_image_count)}</strong></div>
                <div class="metric-row"><span class="muted">${带提示标签('原通过率', '公式：admin_approve_count / ai_first_ready_count。分子是通过动作次数，分母是首次进入 ai_ready 的效果图张数。')}</span><strong>${格式化百分比(review.original_pass_rate)}</strong></div>
                <div class="metric-row"><span class="muted">${带提示标签('重制通过率', '公式：admin_approve_count / ai_total_ready_count。分子是通过动作次数，分母是全部批次进入 ai_ready 的效果图张数。')}</span><strong>${格式化百分比(review.remake_pass_rate)}</strong></div>
              </div>
            </div>
          </div>
          <div class="note-box">
            <div><strong>简单说明：</strong>P50 表示一半订单会在这个时间内完成，P90 表示 90% 的订单会在这个时间内完成。</div>
            <div>提交到 AI 提交，反映任务入队速度。AI 提交到 AI ready，反映模型生成和系统审核速度。AI ready 到交付，反映人工审核和交付速度。</div>
            <div>提交到交付总时长看整体效率，重生成次数越高，通常表示当前生图结果需要更多人工返工。</div>
            <div>原通过率看首次生图质量，重制通过率看人工处理过的全部图片里最终有多少被通过。</div>
          </div>
        </div>
      `;
    }

    function 渲染页面(data) {
      document.getElementById('content').innerHTML = [
        渲染总览(data),
        渲染投资人快照(data),
        渲染用户画像(data),
        渲染转化漏斗(data),
        渲染服务看板(data),
        渲染服务审核通过率(data),
        渲染作品选定方式(data),
        渲染作品库(data),
        渲染运营效率(data)
      ].join('');
      初始化提示浮窗();
    }

    async function 加载看板() {
      const secret = document.getElementById('admin-secret').value.trim();
      const startDate = document.getElementById('start-date').value;
      const endDate = document.getElementById('end-date').value;
      if (!secret) {
        alert('请输入管理密钥');
        return;
      }
      持久化管理密钥(secret);
      document.getElementById('content').innerHTML = '<div class="loading">看板加载中...</div>';
      try {
        const url = `/api/admin/analytics/dashboard?start_date=${encodeURIComponent(startDate)}&end_date=${encodeURIComponent(endDate)}`;
        const response = await fetch(url, { headers: { 'x-admin-secret': secret } });
        if (response.status === 403) {
          document.getElementById('content').innerHTML = '<div class="error">管理密钥错误。</div>';
          return;
        }
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '看板加载失败');
        当前数据 = data;
        渲染页面(data);
      } catch (error) {
        document.getElementById('content').innerHTML = `<div class="error">${error.message || '看板加载失败'}</div>`;
      }
    }

    document.getElementById('admin-secret').addEventListener('keydown', event => {
      if (event.key === 'Enter') 加载看板();
    });

    window.addEventListener('scroll', 隐藏全局提示, true);
    window.addEventListener('resize', 隐藏全局提示);

    window.addEventListener('molink:exhibitions-loaded', event => {
      const current = event.detail && event.detail.current;
      if (!current) return;
      const startInput = document.getElementById('start-date');
      const endInput = document.getElementById('end-date');
      if (current.starts_at) startInput.value = String(current.starts_at).slice(0, 10);
      endInput.value = current.ends_at ? String(current.ends_at).slice(0, 10) : 默认日期(0);
      if (document.getElementById('admin-secret').value.trim()) 加载看板();
    });

    window.addEventListener('DOMContentLoaded', () => {
      const presetSecret = 获取预填密钥();
      document.getElementById('admin-secret').value = presetSecret;
      更新导航(presetSecret);
      document.getElementById('start-date').value = 默认日期(-6);
      document.getElementById('end-date').value = 默认日期(0);
      if (presetSecret) {
        加载看板();
      }
    });
  </script>
</body>
</html>
